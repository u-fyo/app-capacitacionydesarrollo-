/* ── becas ── */
/* ═════════ COMITÉ DE BECAS: criterios, ponderación y cálculo ═════════
   Mismo modelo que usa el comité (sacado del simulador oficial):
   5 criterios ponderados + tope según nivel jerárquico y costo en USD. */
const BECA_ARS_RATE=1595.98;
const BECA_WEIGHTS={desempeno:.25,proyeccionPosicion:.25,proyeccionRotacion:.20,alineacion:.20,aplicacion:.10};
const BECA_ESCALAS={
 desempeno:[{l:'3,6 o +',v:100},{l:'3,3 a 3,59',v:75},{l:'3,1 a 3,29',v:50},{l:'3',v:25},{l:'Insuficiente / < 3',v:0}],
 proyeccionPosicion:[{l:'Clave',v:100},{l:'Mantener',v:75},{l:'Dejar ir',v:0},{l:'Tomar decisión',v:0}],
 proyeccionRotacion:[{l:'Baja',v:100},{l:'Media',v:50},{l:'Alta',v:0}],
 alineacion:[{l:'Alta',v:100},{l:'Media',v:75},{l:'Baja',v:50},{l:'Nula',v:0}],
 aplicacion:[{l:'Inmediata',v:100},{l:'Mediano plazo',v:75},{l:'Largo plazo',v:50}],
};
const BECA_CRIT_LABEL={desempeno:'Evaluación de desempeño',proyeccionPosicion:'Proyección en el rol',
 proyeccionRotacion:'Riesgo de rotación',alineacion:'Alineación de objetivos',aplicacion:'Aplicación en el rol'};
function becaLevelCap(nivel,costUSD){
 nivel=nivel||'';
 if(costUSD>6000){if(nivel.includes('N4'))return .50;if(nivel.includes('N3'))return .60;if(nivel.includes('N2'))return .75;return .50}
 else{if(nivel.includes('N4'))return .60;if(nivel.includes('N3'))return .70;if(nivel.includes('N2'))return .80;return .60}
}
/* devuelve el cálculo completo de cobertura para una postulación de beca */
/* % de beca: sale de la evaluación del comité y se redondea de a 10 (44% → 40%). Si se acuerda otro %, se usa ese. */
function calcBeca(b){
 const ac=(b.cobAcordada!==undefined&&b.cobAcordada!==null&&b.cobAcordada!==''&&!isNaN(+b.cobAcordada))?Math.max(0,Math.min(100,+b.cobAcordada)):null;
 const fin=(o)=>{const sug=Math.round((o.coverage||0)/10)*10,cov=ac!==null?ac:sug;
  return{...o,comite:o.coverage||0,sugerida:sug,acordada:ac,coverage:cov,monto:Math.round(cov/100*(+b.costoARS||0))}};
 const ev=b.eval||{};
 if(b.isAnnulled)return{weightedScore:0,levelCap:0,coverage:0,monto:0,comite:0,sugerida:0,acordada:null,bloqueada:'Anulada: '+(b.annulmentReason||'sin motivo')};
 const d=ev.desempeno||0,p=ev.proyeccionPosicion||0;
 if(!d||!p)return fin({weightedScore:0,levelCap:0,coverage:0,bloqueada:'Desempeño y potencial son obligatorios (sin esos dos, cobertura 0%)'});
 const ws=(d*BECA_WEIGHTS.desempeno+p*BECA_WEIGHTS.proyeccionPosicion+(ev.proyeccionRotacion||0)*BECA_WEIGHTS.proyeccionRotacion+
  (ev.alineacion||0)*BECA_WEIGHTS.alineacion+(ev.aplicacion||0)*BECA_WEIGHTS.aplicacion)/100;
 const costUSD=(+b.costoARS||0)/BECA_ARS_RATE,cap=becaLevelCap(b.nivel,costUSD);
 return fin({weightedScore:ws,levelCap:cap,coverage:ws*cap*100})}
function setCobAcordada(id,v,ficha){const b=DB.beca.find(x=>x.id===id);
 if(v===''||v===null||isNaN(+v))delete b.cobAcordada;else b.cobAcordada=Math.max(0,Math.min(100,+v));
 guardar();refresh();if(ficha)pintarFichaBeca(id);
 toast(b.cobAcordada===undefined?'Vuelve el % del comité':'% de beca de '+b.nom+': '+b.cobAcordada+'%')}
/* sugerencia automática: usa lo que la app sabe (antigüedad como proxy de rotación) y deja el resto
   en un valor neutro para que el comité lo confirme — nunca decide sola, solo tira un punto de partida */
function sugerirBeca(b){
 const p=nomDe(b.nom)||{};
 const sug={};
 if(p.ingreso){
  const años=(new Date(HOY)-new Date(p.ingreso))/(365.25*24*3600*1000);
  sug.proyeccionRotacion=años>=2?100:años>=1?50:0;
 }else sug.proyeccionRotacion=50;
 sug.desempeno=50;sug.proyeccionPosicion=75;sug.alineacion=75;sug.aplicacion=75;
 return sug;
}
/* ── ejercicios: límites calendario y ejercicio siguiente ── */
function ejBounds(ej){const y1=2000+ +ej.split('.')[0];return{inicio:y1+'-10',fin:(y1+1)+'-09'}}
function ejSiguiente(ej){const y1=2000+ +ej.split('.')[0];return String(y1+1).slice(2)+'.'+String(y1+2).slice(2)}
/* cuotas de pago: por default igual a la duración en meses, salvo que se cargue un número distinto
   (ej: programa de 18 meses pero que se abona en 32 cuotas) */
function becaCuotas(b){return(+b.cuotas||+b.meses||1)}
function becaArancelCalc(b){if(+b.cuotaMonto)return Math.round(+b.cuotaMonto);return Math.round(Math.max(0,(+b.costoARS||0)-(+b.matricula||0))/becaCuotas(b))}
function becaCubMensual(b){const c=calcBeca(b);return Math.round(becaArancelCalc(b)*(c.coverage||0)/100)}
/* meses calendario que dura la beca (para saber cuándo empieza/termina y en qué ejercicio cae cada pago) */
function mesesBecaCalendario(b){
 if(!b.ini)return[];
 const dur=becaCuotas(b);
 const o=[],y=+b.ini.slice(0,4),m=+b.ini.slice(5,7);
 for(let k=0;k<dur;k++){const t=m-1+k,yy=y+Math.floor(t/12),mm=(t%12)+1;o.push(yy+'-'+String(mm).padStart(2,'0'))}
 return o;
}
/* presupuesto de becas: ejecutado, lo que resta hasta el cierre de este ejercicio, y lo ya comprometido
   con el ejercicio que viene (becas de hoy que se siguen pagando después de octubre) */
function presupuestoBecas(){
 const aprob=DB.beca.filter(b=>b.veredicto==='Aprobada'&&b.ini&&(b.meses||b.cuotas));
 const finEJ=ejBounds(EJ).fin, ejSig=ejSiguiente(EJ), fBounds=ejBounds(ejSig);
 let ejecutado=0,restaEsteEJ=0,comprometidoProxEJ=0;
 aprob.forEach(b=>{
  const cub=becaCubMensual(b);
  mesesBecaCalendario(b).forEach(m=>{
   if(m<=HOY.slice(0,7))ejecutado+=cub;
   else if(m<=finEJ)restaEsteEJ+=cub;
   else if(m>=fBounds.inicio&&m<=fBounds.fin)comprometidoProxEJ+=cub;
  });
 });
 const presupuestoProxEJ=DB.part.filter(p=>p.ej===ejSig).reduce((a,c)=>a+(+c.asignado||0),0);
 return{ejecutado,restaEsteEJ,comprometidoProxEJ,presupuestoProxEJ,ejSig,
  pctProxEJ:presupuestoProxEJ?pct(comprometidoProxEJ,presupuestoProxEJ):null}
}
/* inversión real en becas: cada postulación aprobada tiene un reparto entre "este ejercicio" y "el que viene"
   (lo cargó el comité al evaluar, según cuándo cae cada tramo del programa) — esto es lo que hay que mostrar
   como número principal, no una proyección calendario aparte */
function inversionBecas(){
 const aprob=DB.beca.filter(b=>b.veredicto==='Aprobada'),sig=ejSiguiente(EJ);
 let total=0,esteEJ=0,proxEJ=0;
 aprob.forEach(b=>{const monto=calcBeca(b).monto||0,sp=b.impactSplit||{fy25:100,fy26:0},e0=b.ejOtorg||'25.26',e1=ejSiguiente(e0);
  total+=monto;
  [[e0,sp.fy25||0],[e1,sp.fy26||0]].forEach(([e,pc])=>{const m=monto*pc/100;if(e===EJ)esteEJ+=m;else if(e===sig)proxEJ+=m})});
 return{total,esteEJ,proxEJ,ejSig:sig}

function setBeca(id,path,val){
 const b=DB.beca.find(x=>x.id===id);
 if(path.startsWith('eval.')){b.eval=b.eval||{};b.eval[path.slice(5)]=val}
 else b[path]=val;
 if(path==='nom'){const r=buscarPersona(val);if(r)Object.assign(b,{lg:r.legajo,un:r.unidad,vn:r.vn,soc:r.sociedad||b.soc,
  lider:b.lider||r.liderC||r.lider,area:b.area||r.vertical||''})}
 guardar();pintarFichaBeca(id);
}
function sugerirYRellenar(id){
 const b=DB.beca.find(x=>x.id===id),sug=sugerirBeca(b);
 b.eval=Object.assign({},b.eval,sug);guardar();FB.sub=1;pintarFichaBeca(id);
 toast('Sugerencia cargada — el desempeño y la mayoría de los criterios quedaron en un valor neutro, confirmalos con el líder antes de decidir.');
}

function idiMeses(){return mesesEJ(EJ)}
function idiBar(){
 const meses=idiMeses(),hoy=HOY.slice(0,7);
 if(LG._auto&&LG._auto!==hoy&&LG.mesA===LG._auto)LG.mesA='';   /* estaba en el mes automático y cambió el mes: pasa solo al nuevo */
 if(!LG.mesA||!meses.includes(LG.mesA)){LG.mesA=meses.includes(hoy)?hoy:(hoy<meses[0]?meses[0]:meses[meses.length-1]);LG._auto=LG.mesA===hoy?hoy:''}
 const mes=LG.mesA,idx=meses.indexOf(mes),prev=addMes(mes,-1);
 return `<div class="idi-top"><div><div class="idi-per">Período ${mesTxt(mes)}</div>
   <div class="sub2" style="font-size:12px">Facturas pagadas en ${mesTxt(mes)} · cursada de ${mesTxt(prev)}${mes===hoy?'':mes<hoy?' · mes anterior':' · mes próximo'}</div></div>
  <div class="idi-nav">
   <button class="btn n s" ${idx<=0?'disabled style="opacity:.3"':''} onclick="LG.mesA='${meses[idx-1]||''}';refresh()">‹</button>

   <button class="btn n s" ${idx>=meses.length-1?'disabled style="opacity:.3"':''} onclick="LG.mesA='${meses[idx+1]||''}';refresh()">›</button></div></div>`}

/* vigencia del valor de la clase particular: se actualiza cada 6 meses desde cfg.vigenteDesde */
function vigenciaClase(){
 const[y,m]=DB.cfg.vigenteDesde.slice(0,7).split('-').map(Number);
 const t=(y*12+(m-1))+6, y2=Math.floor(t/12), m2=(t%12)+1;
 const prox=y2+'-'+String(m2).padStart(2,'0');
 const t1=t-1, y1=Math.floor(t1/12), m1=(t1%12)+1;
 const ultimoMesVigente=y1+'-'+String(m1).padStart(2,'0');
 return {prox,ultimoMesVigente,esUltimoMes:HOY.slice(0,7)===ultimoMesVigente}

function variacionMensualIdiomas(mesAct,mesAnt){
 const F=DB.fidi.filter(f=>f.ej===EJ);
 const actF=F.filter(f=>f.mes===mesAct),antF=F.filter(f=>f.mes===mesAnt);
 const totAct=actF.reduce((a,f)=>a+f.monto,0),totAnt=antF.reduce((a,f)=>a+f.monto,0);
 const nAct=actF.reduce((a,f)=>a+f.pers.length,0),nAnt=antF.reduce((a,f)=>a+f.pers.length,0);
 if(!totAnt||!nAnt)return null;
 const precioProm=totAnt/nAnt;
 const porVolumen=(nAct-nAnt)*precioProm;
 const porPrecio=(totAct-totAnt)-porVolumen;
 return{totAct,totAnt,nAct,nAnt,porVolumen,porPrecio,delta:totAct-totAnt}
}

/* Presupuesto: misma lógica en todos los ejercicios.
   Base (fija) · Ejecutado (sin DI) · DI ejecutadas (van aparte, están aprobadas) · Real = ejecutado + DI.
   Disponible / excedido = base − ejecutado sin DI. */
function presNum(){
 const C=DB.cierre&&DB.cierre[EJ];let rows;
 if(C)rows=C.cuentas.map(c=>({c:{id:c.id,soc:c.soc,ab:c.soc,cta:c.cta,desc:c.desc,base:c.base},ej:c.sinDI,di:c.di,disp:c.base-c.sinDI,items:[]}));
 else rows=presResumen().map(r=>({c:r.c,ej:r.ej,di:r.di,disp:r.c.base-r.ej,items:r.items}));
 const sm=f=>rows.reduce((a,r)=>a+f(r),0),base=sm(r=>r.c.base),ej=sm(r=>r.ej),di=sm(r=>r.di);
 return{rows,base,ej,di,real:ej+di,disp:base-ej,cierre:!!C}}
/* una sola tarjeta: disponible (verde) o excedido (rojo) */
function metDisp(N,go){return N.disp>=0
 ?met('Disponible',plata(N.disp),`<b>${pct(N.disp,N.base)}%</b> del presupuesto base`,'met-dis ok',go)
 :met('Excedido',plata(-N.disp),`<b>${pct(-N.disp,N.base)}%</b> por encima del presupuesto base`,'met-exc mal',go)}

 return partidas().map(c=>{const it=S[c.id].items,o={c,items:it,cap:0,idi:0,beca:0,ej:0,di:0,com:0};
  it.forEach(i=>{const k=TY[i.t]||'cap';
   if(i.di){if(i.cerrado)o.di+=i.m}
   else if(i.cerrado){o[k]+=i.m;o.ej+=i.m}else o.com+=i.m});
  o.disp=c.base-o.ej;return o})}

let GIMP=[];
function leerGestion(file){
 const rd=new FileReader();
 rd.onload=ev=>{try{
  const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
  const hoja=wb.SheetNames.find(n=>/detalle/i.test(n))||wb.SheetNames.find(n=>/gesti/i.test(n))||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[hoja],{header:1,defval:''});
  const hi=rows.findIndex(r=>r.some(c=>/^cuenta$/i.test(String(c).trim())));
  if(hi<0){toast('No encontré la columna Cuenta');return}
  const H=rows[hi].map(h=>String(h).trim());
  const ix=rx=>H.findIndex(h=>rx.test(h));
  const cCta=ix(/^cuenta$/i),cTot=ix(/^total$/i),cDi=ix(/DI ya aprobadas/i),
   cTope=ix(/TOTAL PRESU/i);
  let cReal=-1,etiqueta='';
  H.forEach((h,i)=>{if(/^real/i.test(h)){cReal=i;etiqueta=h}});
  if(cCta<0||cTot<0){toast('El archivo no tiene el formato esperado');return}
  const norm=s=>String(s||'').replace(/[.\s]/g,'');
  const cmp=[];
  rows.slice(hi+1).forEach(r=>{
   const cta=norm(r[cCta]); if(!cta||!/^\d{6,}$/.test(cta))return;
   const c=DB.part.find(x=>x.ej===EJ&&norm(x.cta)===cta);
   cmp.push({cta,c,base:Math.round(Math.abs(+r[cTot]||0)),
    di:cDi>=0?Math.round(Math.abs(+r[cDi]||0)):0,
    tope:cTope>=0?Math.round(Math.abs(+r[cTope]||0)):0,
    real:cReal>=0?Math.round(Math.abs(+r[cReal]||0)):0,nom:String(r[cCta+1]||'')})});
  if(!cmp.length){toast('No pude leer ninguna cuenta del archivo');return}
  modalGestion(cmp,etiqueta||'Ejecutado',file.name);
 }catch(e){console.error(e);toast('No pude leer el archivo')}};
 rd.readAsArrayBuffer(file);
}

 /* becas: cada cuota ya vencida es un comprobante esperado (a mes vencido) */
 const bn=ejBounds(EJ);
 DB.beca.filter(b=>becaConCrono(b)&&b.est!=='Cancelada').forEach(b=>{const c=ctaGen(b.soc)||{};
  becaCronograma(b).filter(x=>x.pagada&&x.cursada>=bn.inicio&&x.cursada<=bn.fin).forEach(x=>R.push({id:'bec#'+b.id+'#'+x.key,beca:true,ej:EJ,

function setAnyFact(id,k,v){
 if(id.startsWith('bec#')){const[,bid,key]=id.split('#'),b=DB.beca.find(x=>x.id===bid);b.pagos=b.pagos||{};
  const p=b.pagos[key]=b.pagos[key]||{};if(k==='nro')p.nro=v;else if(k==='fcarga')p.fecha=v;

 if(id.includes('#')){const[pid,gi]=id.split('#');const p=acto(pid);p.gastos[+gi][k]=v}
 else if(DB.fidi.some(f=>f.id===id)){DB.fidi.find(f=>f.id===id)[k]=v}
 else{const f=DB.fact.find(x=>x.id===id);if(f)f[k]=v}
 guardar();refresh();toast(k==='fcarga'&&v?'Cargada y marcada como pagada':'Guardado')}
function setRepOv(id,soc,v){const p=acto(id);
 if(v===''||v===null){if(p.repOv){delete p.repOv[soc];if(!Object.keys(p.repOv).length)delete p.repOv}}
 else{const cur=repartoSoc(p);p.repOv=p.repOv||{};
  cur.forEach(g=>{if(p.repOv[g.soc]===undefined)p.repOv[g.soc]=g.monto});
  p.repOv[soc]=+v;
  const total=Object.values(p.repOv).reduce((a,x)=>a+(+x||0),0);

 const fs=DB.fact.filter(f=>f.aid===aid);
 if(fs.some(f=>f.conf)){const t=fs.reduce((a,f)=>a+(+f.monto||0),0);if(t>0){p.real=t;if(!p.alta)p.alta=HOY}}}

 {const p=acto(aid);if(p&&p.facturar)p.facturar.cuotas.forEach(c=>{if(c.gen){c.gen.ids=c.gen.ids.filter(i=>DB.fact.some(x=>x.id===i));if(!c.gen.ids.length)c.gen=null}})}

   ${!VD.todos&&F.length>24?`<div style="text-align:center;margin-top:12px">
    <button class="btn g" onclick="VD.todos=true;refresh()">Ver las ${F.length-24} personas restantes</button></div>`:''}

 <div class="grid g2">

<script>

function invPersona(n){
 let t=0;const it=[];
 DB.plan.forEach(p=>{const me=p.parts.find(x=>x.nom===n);if(!me)return;

   window['_t'+id]=setTimeout(()=>{PS.sub=sub;refresh();const i=$('#'+id);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)};
  else e.onchange=ev=>{PS[k]=ev.target.value;PS.sub=sub;refresh()}};
 bind('psq','q',0);bind('pdim','dim',1);
 ['hq','hcap','hej','hvn','hprov','hfoco'].forEach(k=>bind(k,k,2));
};
function paneColab(){
 const q=PS.q.toLowerCase();
 const L=DB.nom.filter(p=>!q||(p.nombre+p.legajo+(p.unidad||'')+(p.posicion||'')).toLowerCase().includes(q)).slice(0,150);
 const est=n=>{const a=DB.plan.filter(p=>p.ej===EJ&&p.est!=='Cancelada'&&p.parts.some(x=>x.nom===n&&x.est!=='Baja'));
  const fin=a.filter(p=>p.est==='Finalizada').length;
  return{t:a.length,fin,pend:a.length-fin,
   bec:DB.beca.some(b=>b.nom===n&&b.est!=='Cancelada'),idi:DB.idi.some(i=>i.nom===n&&i.est==='Activa')}};
 return `<div class="two">
  <div class="card"><div class="card-h"><h2>Buscar</h2><div class="n">${DB.nom.length} en nómina</div></div>
   <div class="card-b" style="padding:12px">

    <div class="plist">${L.map(p=>{const x=est(p.nombre);
     return `<div class="pit ${PS.sel===p.nombre?'on':''}" onclick="selP('${js(p.nombre)}');refresh()">
     <div class="av ${avc(p.nombre)}">${iniciales(p.nombre)}</div>
     <div style="min-width:0;flex:1"><div class="nom">${esc(p.nombre)}</div>
      <div class="sub2">${esc(p.posicion||'—')} · ${esc(p.unidad||'')}</div></div>
     <div style="display:flex;gap:3px;flex-shrink:0">
      ${x.pend?`<span class="chip c-pen" title="pendientes">${x.pend}</span>`:''}
      ${x.fin?`<span class="chip c-fin" title="finalizadas">${x.fin}</span>`:''}
      ${!x.t&&!x.bec&&!x.idi?'<span class="chip c-can">0</span>':''}</div></div>`}).join('')
     ||'<div class="vacio">Sin resultados.</div>'}</div></div></div>
  <div>${PS.sel?fichaPersona(PS.sel):'<div class="card"><div class="vacio"><b>Elegí una persona</b>Vas a ver qué hizo este ejercicio, sus becas e idiomas y todo su historial.</div></div>'}</div>
 </div>`;
}
function fichaPersona(nom){
 const n=nomDe(nom)||{nombre:nom};
 const{tot,items}=invPersona(nom);
 const cur=items.filter(i=>i.p.ej===EJ);
 const H=histTodo().filter(h=>h.n===nom),ejs={};H.forEach(h=>(ejs[h.e]=ejs[h.e]||[]).push(h));
 const BE=DB.beca.filter(b=>b.nom===nom),ID=DB.idi.filter(i=>i.nom===nom);
 const invEj=cur.filter(i=>i.me.est!=='Baja').reduce((a,i)=>a+i.c,0);
 return `
 <div class="card"><div class="card-b" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
  <div class="av ${avc(nom)}" style="width:52px;height:52px;border-radius:14px;font-size:17px">${iniciales(nom)}</div>
  <div style="flex:1;min-width:190px"><div style="font-size:18px;font-weight:600;letter-spacing:-.3px">${esc(nom)}</div>
   <div class="sub2">${esc(n.posicion||'—')} · ${esc(n.unidad||'')} · ${esc(ab(n.sociedad))}</div></div>
  <div class="chips"><span class="chip c-gris">Legajo ${esc(n.legajo||'—')}</span>
   ${n.vn?`<span class="chip c-gris"><span class="dot" style="background:${VCOL[n.vn]}"></span>${esc(n.vn)}</span>`:''}
   ${n.liderC?(eqDe(n.liderC)?`<span class="chip c-cur" style="cursor:pointer" onclick="VD.vn='${js(n.vn||'')}';VD.eq='${js(eqDe(n.liderC).id)}';ir('vert')">Equipo de ${esc(n.liderC)} →</span>`:`<span class="chip c-gris">Líder: ${esc(n.liderC)}</span>`):''}
   ${n.ingreso?`<span class="chip c-gris">Ingreso ${fecha(n.ingreso)}</span>`:''}</div></div></div>
 ${(()=>{const fin=cur.filter(i=>i.p.est==='Finalizada'&&i.me.est!=='Baja');
  const pend=cur.filter(i=>i.p.est!=='Finalizada'&&i.me.est!=='Baja');
  const bajas=cur.filter(i=>i.me.est==='Baja');
  const focos={};cur.filter(i=>i.me.est!=='Baja').forEach(i=>focos[i.p.foco]=(focos[i.p.foco]||0)+1);
  const mx=Math.max(1,...Object.values(focos));
  return `<div class="dash">
   <div class="dcard"><h4>Cómo viene el ${EJ}</h4>
    <div class="ring">${ring(pct(fin.length,cur.length||1),fin.length===cur.length&&cur.length?'var(--verde)':'var(--celeste)',66)}
     <div><div class="rv">${fin.length} de ${cur.length}</div><div class="rs">finalizadas${bajas.length?'<br>'+bajas.length+' con baja':''}</div></div></div></div>
   <div class="dcard"><h4>Le queda pendiente</h4>
    ${pend.length?`<div class="rv" style="color:var(--naranja)">${pend.length}</div>
     <div class="rs" style="margin-top:5px;line-height:1.6">${pend.slice(0,4).map(i=>'• '+esc(i.p.nom)).join('<br>')}
      ${pend.length>4?'<br>+'+(pend.length-4)+' más':''}</div>`
     :`<div class="rv" style="color:var(--verde)">Nada</div><div class="rs" style="margin-top:5px">Cerró todo lo asignado este ejercicio.</div>`}</div>
   <div class="dcard"><h4>Invertido</h4>
    <div class="rv">${invEj?platak(invEj):'—'}</div>
    <div class="rs" style="margin-top:4px">en el ${EJ}${BE.length?' · beca incluida':''}</div>
    <div class="rs" style="margin-top:7px">Histórico ${tot?platak(tot):'—'}</div></div>
   <div class="dcard"><h4>En qué se capacitó</h4>
    <div class="hbars">${FOCOS.map(f=>{const n=focos[f]||0;
     return `<div class="hbar"><span>${esc(f)}</span><div class="hb"><i style="width:${pct(n,mx)}%;background:${n?'var(--celeste)':'var(--linea)'}"></i></div>
      <b style="${n?'':'color:var(--gris)'}">${n}</b></div>`}).join('')}</div>
    <div class="rs" style="margin-top:8px">${H.length} registros en el histórico · ${Object.keys(ejs).length} ejercicios</div></div>
  </div>`})()}
 <div class="card"><div class="card-h"><h2>Plan ${EJ}</h2></div><div class="card-b flush">
  ${cur.length?`<div class="scroll"><table>
   <thead><tr><th>Capacitación</th><th>Proveedor</th><th>Foco</th><th>Fecha</th><th class="r">Costo asignado</th><th>Su estado</th></tr></thead>
   <tbody>${cur.map(i=>`<tr class="clic" onclick="ir('act','${i.p.id}')">
    <td><div class="nom">${esc(i.p.nom)}</div>${i.me.motivo?`<div class="sub2">↳ ${esc(i.me.motivo)}</div>`:''}</td>
    <td class="sub2">${esc(i.p.prov)}</td><td>${fchip(i.p.foco)}</td>
    <td class="num" style="font-size:12px">${actFechas(i.p).ini?fecha(actFechas(i.p).ini):'—'}</td>

  </tbody></table></div>`:'<div class="vacio">Sin capacitaciones este ejercicio.</div>'}</div></div>
 ${BE.length?`<div class="card"><div class="card-h"><h2>Becas</h2></div><div class="card-b flush"><div class="scroll"><table>
  <thead><tr><th>Institución</th><th>Carrera</th><th class="r">Cobertura</th><th class="r">Monto</th><th>Veredicto</th></tr></thead>
  <tbody>${BE.map(b=>{const c=calcBeca(b);return `<tr class="clic" onclick="ir('bi');verFichaBeca('${b.id}')">
   <td class="nom">${esc(b.inst||'a definir')}</td><td class="sub2">${esc(b.carrera||'—')}</td>
   <td class="r num">${c.coverage?Math.round(c.coverage)+'%':'—'}</td>
   <td class="r num">${c.monto?plata(c.monto):(b.ejec?plata(b.ejec):'—')}</td>
   <td>${b.veredicto==='Aprobada'?'<span class="chip c-act">Aprobada</span>':b.veredicto==='Rechazada'?`<span class="chip c-can" title="${esc(b.annulmentReason||'')}">Rechazada</span>`:'<span class="chip c-pen">Pendiente</span>'}</td></tr>`}).join('')}</tbody>
 </table></div></div></div>`:''}
 ${ID.length?`<div class="card"><div class="card-h"><h2>Idiomas</h2></div><div class="card-b flush"><div class="scroll"><table>
  <thead><tr><th>Idioma</th><th>Profe</th><th>Desde</th><th class="r">Clases</th><th class="r">Total</th><th>Estado</th></tr></thead>
  <tbody>${ID.map(i=>{const h=i.hist||[];return `<tr class="clic" onclick="LG.sub=0;ir('idio');editIdi('${i.id}')">
   <td><span class="chip c-gris">${esc(i.idioma)}</span></td><td>${esc(i.profe)}</td>
   <td class="num" style="font-size:12px">${fecha(i.alta)}</td><td class="r num">${h.length}</td>
   <td class="r num">${plata(h.reduce((a,y)=>a+(+y.imp||0),0))}</td><td>${chip(i.est)}</td></tr>`}).join('')}</tbody>
 </table></div></div></div>`:''}
 <div class="card"><div class="card-h"><h2>Historial por año</h2><div class="n">${H.length} registros</div>
   <button class="btn g s" onclick="addHist('${js(nom)}')">+ Agregar</button></div>
  <div class="card-b">${Object.keys(ejs).length?`<div class="tl">${Object.keys(ejs).sort().reverse().map(e=>
   `<div class="tli ${e===EJ?'':'g'}"><div class="y">${e} <span class="sub2" style="font-weight:400">· ${ejs[e].length} capacitacion${ejs[e].length===1?'':'es'}</span></div>
    ${ejs[e].slice().sort((a,b)=>a.c.localeCompare(b.c)).map(h=>`<div class="hy-it"><div style="min-width:0"><div class="nom" style="font-size:13px">${esc(h.c)}</div><div class="sub2">${esc(h.i||'sin proveedor')}</div></div>
     <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">${histChip(h)}
      ${h.plan?`<button class="btn n s" title="Ver la capacitación" onclick="ir('act','${h.pid}')">↗</button>`:`<button class="btn n s" onclick="editHist('${h.id}')">✎</button><button class="btn n s" onclick="delHist('${h.id}')">✕</button>`}</div></div>`).join('')}</div>`).join('')}</div>`
  :'<div class="vacio"><b>Sin historial previo</b>Es su primer registro.</div>'}</div></div>`;
}

/* Histórico: los ejercicios que están en el plan salen del plan (lo finalizado, en curso y lo que pasó al nuevo ejercicio);
   los años anteriores vienen del histórico cargado desde el dashboard */
function histTodo(){
 const ejP=new Set(DB.plan.map(p=>p.ej)),out=DB.hist.filter(h=>!ejP.has(h.e));
 DB.plan.forEach(p=>{if(p.est==='Cancelada'||p.est==='Diferida')return;
  const st=p.est==='Finalizada'?'Finalizada':(p.est==='En curso'?'En curso':'Pendiente');
  p.parts.forEach(x=>{if(x.est==='Baja')return;
   out.push({id:'pl#'+p.id+'#'+(x.lg||x.nom),n:x.nom,c:p.nom,e:p.ej,i:(p.prov&&p.prov!=='A definir')?p.prov:'',s:st,plan:true,pid:p.id,arr:!!p.arrastra,foco:p.foco||''})})});
 return out}
const histEst=h=>h.s==='Realizado'?'Finalizada':h.s;
const histChip=h=>{const e=histEst(h);return `<span class="chip ${e==='Finalizada'?'c-fin':e==='En curso'?'c-cur':e==='Pendiente'?'c-pen':'c-gris'}">${esc(e)}</span>`+(h.arr?' <span class="chip c-dif" title="Venía del ejercicio anterior y quedó pendiente">↩ pasó del ej. anterior</span>':'')};
/* ═════ búsqueda de líderes y equipos (por nombre o apodo: "maxi", "auad") ═════ */
const APODOS={nacho:'ignacio',nachito:'ignacio',maxi:'maximiliano',fede:'federico',nico:'nicolas',seba:'sebastian',pancho:'francisco',paco:'francisco',beto:'roberto',rober:'roberto',lucho:'luciano',pablito:'pablo',gonza:'gonzalo',facu:'facundo',santi:'santiago',guille:'guillermo',javi:'javier',marce:'marcelo',migue:'miguel',juli:'julian',cande:'candelaria',flor:'florencia',vero:'veronica',mari:'mariana',caro:'carolina',pato:'patricio',nacha:'ignacia'};
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const tokOk=(q,t)=>{const a=APODOS[q]||q;if(t.startsWith(a)||t.startsWith(q))return true;return q.length>=5&&(lev(q,t)<=2||lev(q,t.slice(0,q.length+1))<=1)};
function buscarLideres(q){const ks=nomKey(q).split(' ').filter(Boolean);if(!ks.length)return[];
 return DB.eq.map(e=>{const nk=nomKey(e.lider).split(' ');return ks.every(k=>nk.some(t=>tokOk(k,t)))?{e,sc:(nomKey(e.lider)===ks.join(' ')?1000:0)+e.n}:null}).filter(Boolean).sort((a,b)=>b.sc-a.sc).map(x=>x.e)}
function histLider(v){v=String(v||'').trim();if(!v){PS.hlider='';PS.sub=2;refresh();return}
 const ex=DB.eq.find(e=>e.lider===v),c=ex?[ex]:buscarLideres(v);
 if(!c.length){toast('No encontré un líder con “'+v+'”');return}
 PS.hlider=c[0].lider;PS.sub=2;refresh();if(c.length>1)toast('Muestro el equipo de '+c[0].lider+' · también coinciden: '+c.slice(1,4).map(x=>x.lider).join(', '))}

/* ═════ Reportes: se eligen las personas (por líder o gerente, sociedad, área y vertical, combinables), se revisa la lista y se baja en Excel o PDF; queda un historial ═════ */
let RPT={sel:[],para:'',titulo:'',desc:[],ejs:[],modo:'todos',hojaHist:true,est:{Finalizada:true,'En curso':true,Pendiente:true},sinCap:true,conLider:false,
 crit:{lid:[],soc:[],area:[],vert:[]},desm:[],qArea:'',vista:'nuevo',histId:null,todos:false,tipo:'pers',abr:{},cq:'',caps:[],capEd:{}};
const fcorta=iso=>{const p=String(iso||'').slice(0,10).split('-');return p.length===3?`${+p[2]}/${+p[1]}/${p[0].slice(2)}`:''};
const rptHay=n=>RPT.sel.includes(n);
const rptVer=()=>{PS.sub=3;refresh()};
function rptSuma(L){let n=0;L.forEach(x=>{if(x&&!rptHay(x)){RPT.sel.push(x);n++}});RPT.sel.sort((a,b)=>a.localeCompare(b,'es'));return n}
const rptDesc=t=>{if(t&&!RPT.desc.includes(t))RPT.desc.push(t)};
/* —— criterios combinables: dentro de un criterio se suman (o), entre criterios se cruzan (y) —— */
const MODOS={todos:'directos e indirectos',dir:'solo directos',ind:'solo indirectos'};
function rptLidSet(){const S=new Set();RPT.crit.lid.forEach(l=>{const e=DB.eq.find(x=>x.lider===l);if(!e)return;const dir=new Set(e.dir);(RPT.modo==='dir'?e.dir:RPT.modo==='ind'?e.gente.filter(x=>!dir.has(x)):e.gente).forEach(n=>S.add(n));if(RPT.conLider)S.add(l)});return S}
function rptFiltrar(omit,extra){
 const C=RPT.crit,act=k=>k!==omit&&C[k].length;let L=DB.nom.slice();
 if(act('lid')){const S=rptLidSet();L=L.filter(p=>S.has(p.nombre))}
 if(act('soc'))L=L.filter(p=>C.soc.includes(p.sociedad));if(act('area'))L=L.filter(p=>C.area.includes(p.unidad));if(act('vert'))L=L.filter(p=>C.vert.includes(p.vn));
 if(extra)L=L.filter(extra);return L}
const rptActivo=()=>Object.values(RPT.crit).some(a=>a.length);
function rptCand(){return rptActivo()?rptFiltrar().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')):[]}
function rptToggle(k,v){const A=RPT.crit[k],i=A.indexOf(v);i>=0?A.splice(i,1):A.push(v);RPT.desm=[];rptVer()}
function rptAddLid(txt){txt=String(txt||'').trim();if(!txt){toast('Escribí el nombre del líder o gerente');return}
 const ex=DB.eq.find(e=>e.lider===txt),c=ex?[ex]:buscarLideres(txt);if(!c.length){toast('No encontré un líder o gerente con “'+txt+'”');return}
 if(!RPT.crit.lid.includes(c[0].lider))RPT.crit.lid.push(c[0].lider);RPT.desm=[];rptVer();if(c.length>1)toast('Agregué a '+c[0].lider+' · también coinciden: '+c.slice(1,3).map(x=>x.lider).join(', '))}
function rptQuitarLid(l){RPT.crit.lid=RPT.crit.lid.filter(x=>x!==l);RPT.desm=[];rptVer()}
function rptModo(m){RPT.modo=m;RPT.desm=[];rptVer()}
function rptLimpiaCrit(){RPT.crit={lid:[],soc:[],area:[],vert:[]};RPT.desm=[];RPT.qArea='';rptVer()}
function rptDm(n,on){const i=RPT.desm.indexOf(n);if(on&&i>=0)RPT.desm.splice(i,1);if(!on&&i<0)RPT.desm.push(n);rptDmCuenta()}
function rptDmTodos(v){const C=rptCand();RPT.desm=v?[]:C.map(p=>p.nombre);rptVer()}
function rptDmCuenta(){const C=rptCand(),n=C.filter(p=>!RPT.desm.includes(p.nombre)).length,b=document.getElementById('rptSumar');if(b){b.textContent=`Sumar ${n} persona${n===1?'':'s'} al reporte`;b.disabled=!n}}
function rptDescCrit(){const C=RPT.crit,P=[];
 if(C.lid.length)P.push('equipo '+C.lid.join(' + ')+' ('+MODOS[RPT.modo]+')');
 if(C.soc.length)P.push(C.soc.map(ab).join(' + '));if(C.area.length)P.push(C.area.join(' + '));if(C.vert.length)P.push(C.vert.join(' + '));return P.join(' · ')}
function rptSumarPrev(){const C=rptCand().filter(p=>!RPT.desm.includes(p.nombre));if(!C.length){toast('No hay nadie tildado');return}
 const n=rptSuma(C.map(p=>p.nombre));rptDesc(rptDescCrit());RPT.crit={lid:[],soc:[],area:[],vert:[]};RPT.desm=[];RPT.qArea='';rptVer();toast(`${n} persona${n===1?'':'s'} sumada${n===1?'':'s'} al reporte`)}
/* —— sumar directo —— */
function rptPersona(v){v=String(v||'').trim();if(!v)return;const f=buscarPersona(v)||resolverPers(v);
 if(!f){toast('No encontré a “'+v+'” en la nómina');return}
 const n=rptSuma([f.nombre]);rptDesc('personas elegidas a mano');rptVer();toast(n?f.nombre+' sumada/o al reporte':f.nombre+' ya estaba')}
function rptPegar(){const t=(document.getElementById('rptPeg')||{}).value||'';const L=lineasListado(t);if(!L.length){toast('Pegá una lista de nombres');return}
 const ok=[],no=[];L.forEach(l=>{const f=detectarLinea(l);f?ok.push(f.nombre):no.push(l)});const n=rptSuma(ok);rptDesc('lista pegada');rptVer();toast(`${n} sumadas${no.length?' · '+no.length+' sin coincidencia: '+no.slice(0,3).join(', '):''}`)}
function rptTodos(){rptSuma(DB.nom.map(p=>p.nombre));RPT.todos=true;rptDesc('toda la nómina');rptVer();toast(`Toda la nómina: ${DB.nom.length} personas en el reporte`)}
function rptQuitar(n){RPT.sel=RPT.sel.filter(x=>x!==n);rptVer()}
function rptLimpiar(){RPT.sel=[];RPT.desc=[];RPT.todos=false;RPT.histId=null;RPT.titulo='';rptVer()}
function rptEj(e){const A=RPT.ejs.length?RPT.ejs.slice():[];const i=A.indexOf(e);if(!RPT.ejs.length){RPT.ejs=histTodo().map(h=>h.e).filter((x,k,a)=>a.indexOf(x)===k).filter(x=>x!==e)}else if(i>=0)A.splice(i,1),RPT.ejs=A;else{A.push(e);RPT.ejs=A}rptVer()}
function rptTituloAuto(){if(RPT.tipo==='cap')return rptCapTitulo();const D=RPT.desc.length?RPT.desc:(RPT.sel.length?[RPT.sel.length+' personas']:[]);if(!D.length)return 'Reporte';
 return ('Reporte '+D.join(' + ').replace(/ \(directos e indirectos\)/g,'')).slice(0,80)}
const rptTitulo=()=>(RPT.titulo||'').trim()||rptTituloAuto();
function rptNombreArchivo(ext){const sl=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60);
 const b=RPT.titulo.trim()||RPT.para.trim();return 'Historial_capacitaciones'+(b?'_'+sl(b):'')+'_'+HOY+'.'+ext}
function rptRegs(nombre){const k=nomKey(nombre),out=[],vistos=new Set();
 histTodo().forEach(h=>{if(nomKey(h.n)!==k)return;const est=histEst(h);if(!RPT.est[est])return;if(RPT.ejs.length&&!RPT.ejs.includes(h.e))return;
  const t=h.e+'|'+h.c.trim().toLowerCase()+'|'+(h.i||'').toLowerCase();if(vistos.has(t))return;vistos.add(t);out.push({ej:h.e,cap:h.c.trim(),prov:h.i||'',est})});
 return out.sort((a,b)=>b.ej.localeCompare(a.ej)||a.cap.localeCompare(b.cap,'es'))}

/* —— historial de reportes pedidos (se guarda con el resto de los datos) —— */
const rptFirma=()=>JSON.stringify(RPT.tipo==='cap'?['cap',RPT.caps,RPT.capEd,RPT.crit,RPT.ejs,RPT.est,RPT.para,RPT.titulo]:[RPT.sel,RPT.ejs,RPT.est,RPT.sinCap,RPT.hojaHist,RPT.para,RPT.titulo]);
function rptReg(fmt){
 DB.cfg.reportes=DB.cfg.reportes||[];let h=RPT.histId&&DB.cfg.reportes.find(x=>x.id===RPT.histId);const f=rptFirma();
 if(!h||h.firma!==f){h={id:uid('R'),firma:f,tipo:RPT.tipo,caps:RPT.caps.slice(),capEd:JSON.parse(JSON.stringify(RPT.capEd)),crit:JSON.parse(JSON.stringify(RPT.crit)),modo:RPT.modo,tm:RPT.titulo,titulo:rptTitulo(),fecha:HOY,para:RPT.para.trim(),desc:RPT.desc.slice(),n:RPT.tipo==='cap'?new Set(rptCapRows().map(r=>r.n)).size:RPT.sel.length,todos:RPT.todos&&RPT.sel.length>=DB.nom.length,sel:(RPT.todos&&RPT.sel.length>=DB.nom.length)?[]:RPT.sel.slice(),
  opts:{ejs:RPT.ejs.slice(),est:{...RPT.est},sinCap:RPT.sinCap,hojaHist:RPT.hojaHist},formatos:[]};DB.cfg.reportes.unshift(h);DB.cfg.reportes=DB.cfg.reportes.slice(0,40);RPT.histId=h.id}
 if(!h.formatos.includes(fmt))h.formatos.push(fmt);h.ultima=HOY;guardar()}
function rptEntrada(id){return (DB.cfg.reportes||[]).find(x=>x.id===id)}
function rptAplica(h){RPT.tipo=h.tipo||'pers';RPT.caps=(h.caps||[]).slice();RPT.capEd=JSON.parse(JSON.stringify(h.capEd||{}));if(h.crit){RPT.crit=JSON.parse(JSON.stringify(h.crit));RPT.modo=h.modo||'todos'}RPT.sel=h.todos?DB.nom.map(p=>p.nombre):h.sel.filter(n=>DB.nom.some(p=>p.nombre===n));RPT.todos=!!h.todos;RPT.para=h.para||'';RPT.titulo=h.tm!==undefined?h.tm:'';RPT.desc=(h.desc||[]).slice();
 RPT.ejs=(h.opts.ejs||[]).slice();RPT.est={...h.opts.est};RPT.sinCap=h.opts.sinCap!==false;RPT.hojaHist=h.opts.hojaHist!==false;RPT.histId=h.id}
async function rptRehacer(id,fmt){const h=rptEntrada(id);if(!h)return;const snap=JSON.stringify(RPT);
 try{rptAplica(h);await (h.tipo==='cap'?(fmt==='pdf'?rptCapPDF():rptCapExcel()):(fmt==='pdf'?rptDescargarPDF():rptDescargar()))}finally{const o=JSON.parse(snap);Object.keys(RPT).forEach(k=>delete RPT[k]);Object.assign(RPT,o)}}
function rptAbrir(id){const h=rptEntrada(id);if(!h)return;rptAplica(h);RPT.vista='nuevo';rptVer();toast('Cargué “'+h.titulo+'”: podés ajustarlo y volver a descargarlo')}
function rptBorrar(id){if(!confirm('¿Sacar este reporte del historial?'))return;DB.cfg.reportes=(DB.cfg.reportes||[]).filter(x=>x.id!==id);if(RPT.histId===id)RPT.histId=null;guardar();rptVer()}

function repChip(k,v,n,txt){const on=RPT.crit[k].includes(v);return `<button type="button" class="cb ${on?'on':''}" onclick="rptToggle('${k}','${js(v)}')" title="${esc(v)}">${esc(txt||v)} <b>${n}</b></button>`}
const nzn=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function paneRep(){
 const H=DB.cfg.reportes||[],tile=(k,ico,t,d)=>`<button type="button" class="rtile ${RPT.tipo===k&&RPT.vista==='nuevo'?'on':''}" onclick="RPT.tipo='${k}';RPT.vista='nuevo';rptVer()"><span class="rt-i">${ico}</span><span class="rt-t">${t}</span><span class="rt-d">${d}</span></button>`;
 return `<div class="rpt-top"><div><div class="eyebrow">Reportes</div><h2 class="rpt-h">Elegí el reporte</h2></div>
   <button type="button" class="cb ${RPT.vista==='hist'?'on':''}" onclick="RPT.vista=RPT.vista==='hist'?'nuevo':'hist';rptVer()">🕘 Reportes pedidos <b>${H.length}</b></button></div>
  <div class="rtiles">${tile('pers','👤','Por persona o equipo','Qué capacitaciones hizo cada persona. Elegís personas, un equipo, una sociedad o un área.')}${tile('cap','📚','Por capacitación','Quiénes hicieron una capacitación (por ejemplo Oratoria), con su proveedor y el año.')}</div>`+
  (RPT.vista==='hist'?repHist():(RPT.tipo==='cap'?repCap():repPers()))}
/* sección plegable */
const acc=(k,ico,tit,badge,cuerpo)=>`<details class="acc" ${RPT.abr[k]?'open':''} ontoggle="RPT.abr['${k}']=this.open"><summary><span style="font-size:18px">${ico}</span><span>${tit}</span>${badge?`<span class="acc-n">${badge}</span>`:''}</summary><div class="acc-b">${cuerpo}</div></details>`;
const stepH=(n,col,tit,sub)=>`<div class="stp-h" style="background:${col}"><span class="stp-n">${n}</span><div><div class="stp-t">${tit}</div>${sub?`<div class="stp-s">${sub}</div>`:''}</div></div>`;
/* los cuatro criterios combinables (líder, sociedad, área, vertical) */
function rptCriterios(){
 const C=RPT.crit,lid=DB.eq.slice().sort((a,b)=>a.lider.localeCompare(b.lider,'es'));
 const cntBy=(k,f)=>{const m={};rptFiltrar(k).forEach(p=>{const v=f(p);if(v)m[v]=(m[v]||0)+1});return m};
 const cs=cntBy('soc',p=>p.sociedad),ca=cntBy('area',p=>p.unidad),cv=cntBy('vert',p=>p.vn);
 const areas=Object.keys(ca).concat(C.area.filter(a=>!ca[a])).filter((a,i,A)=>A.indexOf(a)===i).filter(a=>!RPT.qArea||nomKey(a).includes(nomKey(RPT.qArea))||C.area.includes(a)).sort((a,b)=>(C.area.includes(b)-C.area.includes(a))||((ca[b]||0)-(ca[a]||0))||a.localeCompare(b,'es'));
 const bL=`<div style="display:flex;gap:8px"><input class="fi" id="rptL" list="dlLid2" placeholder="Ej: Roberto Gianneschi, Nicolás Sesnich" style="flex:1" onkeydown="if(event.key==='Enter')rptAddLid(this.value)"><button class="btn" onclick="rptAddLid(document.getElementById('rptL').value)">Agregar</button></div>
   <datalist id="dlLid2">${lid.map(e=>`<option value="${esc(e.lider)}">${esc(e.pos||'')} · ${e.nd} directos · ${e.n-e.nd} indirectos</option>`).join('')}</datalist>
   ${C.lid.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${C.lid.map(l=>{const e=DB.eq.find(x=>x.lider===l)||{};return `<span class="cb on" style="cursor:default">${esc(l)} <span class="sub2" style="opacity:.8">· ${esc(e.pos||'')} · ${e.nd||0}+${(e.n||0)-(e.nd||0)}</span> <button type="button" title="Sacar" style="border:none;background:none;cursor:pointer;font-size:13px;color:inherit" onclick="rptQuitarLid('${js(l)}')">✕</button></span>`}).join('')}</div>`:'<div class="sub2" style="margin-top:8px">Escribí el nombre (alcanza con un apellido o apodo) y elegí al líder o gerente.</div>'}
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${Object.entries(MODOS).map(([k,t])=>`<button type="button" class="cb ${RPT.modo===k?'on':''}" onclick="rptModo('${k}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}</div>
   <label class="check" style="margin-top:8px;font-size:12px"><input type="checkbox" ${RPT.conLider?'checked':''} onchange="RPT.conLider=this.checked;RPT.desm=[];rptVer()"> Incluir también al líder</label>`;
 const bS=`<div style="display:flex;gap:6px;flex-wrap:wrap">${Object.entries(cs).concat(C.soc.filter(x=>!cs[x]).map(x=>[x,0])).sort((a,b)=>b[1]-a[1]).map(([k,n])=>repChip('soc',k,n,ab(k))).join('')||'<span class="sub2">Sin resultados con los otros filtros</span>'}</div>`;
 const bA=`<input class="fi" placeholder="Buscar un área…" value="${esc(RPT.qArea)}" oninput="RPT.qArea=this.value;clearTimeout(window._tqa);window._tqa=setTimeout(()=>{rptVer();const i=document.querySelector('#pn-pe-3 input[placeholder^=\\'Buscar un área\\']');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)" style="margin-bottom:10px">
   <div style="display:flex;gap:6px;flex-wrap:wrap;max-height:190px;overflow:auto;padding-right:4px">${areas.map(a=>repChip('area',a,ca[a]||0)).join('')||'<span class="sub2">No hay áreas con esos filtros</span>'}</div>`;
 const bV=`<div style="display:flex;gap:6px;flex-wrap:wrap">${Object.entries(cv).concat(C.vert.filter(x=>!cv[x]).map(x=>[x,0])).sort((a,b)=>b[1]-a[1]).map(([k,n])=>repChip('vert',k,n)).join('')||'<span class="sub2">Sin resultados con los otros filtros</span>'}</div>`;
 return{bL,bS,bA,bV,nL:C.lid.length,nS:C.soc.length,nA:C.area.length,nV:C.vert.length}}
function rptPreview(){
 const cand=rptCand(),desm=new Set(RPT.desm),nSel=cand.filter(p=>!desm.has(p.nombre)).length,C=RPT.crit;
 const activos=[C.lid.length?'equipo de '+C.lid.length+(C.lid.length===1?' líder':' líderes'):'',C.soc.length?C.soc.length+' sociedad'+(C.soc.length===1?'':'es'):'',C.area.length?C.area.length+' área'+(C.area.length===1?'':'s'):'',C.vert.length?C.vert.length+' vertical'+(C.vert.length===1?'':'es'):''].filter(Boolean);
 return {nSel,html:`<div class="card" style="margin-top:12px;border-color:var(--celeste)"><div class="card-h"><h2>Vista previa · ${cand.length} persona${cand.length===1?'':'s'}</h2><div class="n">${activos.join(' + ')} · destildá a quien no quieras</div>
   <div style="display:flex;gap:6px"><button class="btn n s" onclick="rptDmTodos(true)">Tildar todos</button><button class="btn n s" onclick="rptDmTodos(false)">Destildar todos</button><button class="btn n s" onclick="rptLimpiaCrit()">Limpiar filtros</button></div></div>
  <div class="card-b flush">${cand.length?`<div class="scroll" style="max-height:320px"><table><thead><tr><th style="width:36px"></th><th>Persona</th><th>Puesto</th><th>Sociedad</th><th>Área</th><th>Líder</th></tr></thead>
   <tbody>${cand.map(p=>`<tr><td><input type="checkbox" ${desm.has(p.nombre)?'':'checked'} onchange="rptDm('${js(p.nombre)}',this.checked)"></td><td class="nom">${esc(p.nombre)}${rptHay(p.nombre)?' <span class="chip c-gris">ya está</span>':''}</td><td class="sub2">${esc(p.posicion||'—')}</td><td class="sub2">${esc(ab(p.sociedad))}</td><td class="sub2">${esc(p.unidad||'—')}</td><td class="sub2">${esc(p.liderC||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="vacio"><b>Con esa combinación no hay nadie</b>Probá sacar algún filtro.</div>'}</div>
  <div class="card-b" style="border-top:1px solid var(--linea-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" id="rptSumar" ${nSel?'':'disabled'} onclick="rptSumarPrev()">Sumar ${nSel} persona${nSel===1?'':'s'} al reporte</button><span class="sub2">Después podés seguir sumando otros grupos al mismo reporte.</span></div></div>`}}
/* paso final: qué incluir y descargar (con otro color para que se note que es distinto) */
function rptPasoDescarga(esCap,hayDatos,ejs){
 const ejChips=`<div class="f"><label>Ejercicios <span class="sub2" style="font-weight:400">· ${RPT.ejs.length?RPT.ejs.length+' elegido'+(RPT.ejs.length===1?'':'s'):'todos'}</span></label>

  const ek=h.e+'|'+(h.i||'');let e=g.eds.get(ek);if(!e){e={ek,ej:h.e,prov:h.i||'',pers:new Set(),est:{}};g.eds.set(ek,e)}e.pers.add(h.n);const st=histEst(h);e.est[st]=(e.est[st]||0)+1;g.pers.add(h.n)});
 m.forEach(g=>{g.nom=Object.entries(g.nombres).sort((a,b)=>b[1]-a[1])[0][0]});return m}

 const set=rptActivo()?new Set(rptFiltrar().map(p=>p.nombre)):null,sel=new Set(RPT.caps),out=[],vistos=new Set();
 histTodo().forEach(h=>{const k=nzn(h.c);if(!sel.has(k))return;const ek=h.e+'|'+(h.i||'');if((RPT.capEd[k]||{})[ek]===false)return;if(RPT.ejs.length&&!RPT.ejs.includes(h.e))return;const est=histEst(h);if(!RPT.est[est])return;if(set&&!set.has(h.n))return;
  const t=k+'|'+ek+'|'+h.n;if(vistos.has(t))return;vistos.add(t);out.push({k,cap:h.c.trim(),ej:h.e,prov:h.i||'',est,n:h.n})});return out}

let CAL={vista:'mes',ref:'2026-08-01',dict:'',foco:'',q:''};
const d2s=d=>d.toISOString().slice(0,10);

function lunes(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(12,0,0,0);return x}
function eventos(){
 const o=[],q=(CAL.q||'').trim().toLowerCase();
 plan().forEach(p=>{if(p.est==='Cancelada')return;if(q&&!(p.nom+' '+(p.prov||'')).toLowerCase().includes(q))return;
  if(CAL.dict&&p.dict!==CAL.dict)return;if(CAL.foco&&p.foco!==CAL.foco)return;
  (p.enc||[]).forEach(e=>{if(e.fecha)o.push({...e,p})})});
 return o.sort((a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||'')));
}
function mover(n){const d=s2d(CAL.ref);
 if(CAL.vista==='mes')d.setMonth(d.getMonth()+n);
 else if(CAL.vista==='semana')d.setDate(d.getDate()+7*n);else d.setDate(d.getDate()+n);
 CAL.ref=d2s(d);refresh()}

 if(CAL.vista==='mes')return MESL[d.getMonth()]+' '+d.getFullYear();
 if(CAL.vista==='dia')return d.getDate()+' de '+MESL[d.getMonth()]+' '+d.getFullYear();
 const l=lunes(d),f=new Date(l);f.setDate(f.getDate()+6);
 return l.getDate()+' '+MESC[l.getMonth()]+' – '+f.getDate()+' '+MESC[f.getMonth()]+' '+f.getFullYear()}
const evChip=e=>`<span class="ev ${e.p.dict==='Interno'?'int':'ext'}" title="${esc(e.p.nom)} · ${esc(e.p.prov)}" onclick="ir('act','${e.p.id}')">${e.hora?'<b>'+e.hora+'</b> ':''}${esc(e.tit||e.p.nom)}</span>`;

 const L=plan().filter(p=>p.est!=='Cancelada'&&(p.nom+' '+(p.prov||'')).toLowerCase().includes(t));

 }
 return `

let PV={q:'',tipo:'',act:'',cap:''};
function statsProv(n){
 const acts=DB.plan.filter(p=>p.prov===n);
 const idis=DB.idi.filter(x=>x.profe===n);
 const becs=DB.beca.filter(b=>b.inst===n);
 const fA=DB.fact.filter(f=>f.prov===n).reduce((a,f)=>a+f.monto,0);
 const fI=DB.fidi.filter(f=>f.profe===n).reduce((a,f)=>a+f.monto,0);
 const eA=acts.reduce((a,p)=>a+(p.real||0),0);
 const pers=new Set();acts.forEach(p=>p.parts.forEach(x=>pers.add(x.nom)));
 idis.forEach(x=>pers.add(x.nom));becs.forEach(b=>pers.add(b.nom));
 const imp=DB.fidi.filter(f=>f.profe===n&&!(f.nro||f.fpago)).reduce((a,f)=>a+f.monto,0)
  +DB.fact.filter(f=>f.prov===n&&!(f.nro||f.fpago)).reduce((a,f)=>a+f.monto,0);
 return{acts,idis,becs,total:Math.round(eA+fI+becs.reduce((a,b)=>a+(+b.ejec||0),0)),
  pers:pers.size,imp,n:acts.length+idis.length+becs.length};
}
/* un proveedor está activo si tiene una capacitación en curso o con fecha de inicio (todavía no terminada), alumnos de idiomas o una beca en curso */
function provEstado(nom){
 const nz=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(),nn=nz(nom);
 /* activo: tiene algo en curso, o con fecha de inicio que todavía no terminó (de cualquier ejercicio); inactivo: todo finalizado, cancelado o sin fechas */
 const a=DB.plan.find(p=>nz(p.prov)===nn&&!['Finalizada','Cancelada','Diferida'].includes(p.est)&&(p.est==='En curso'||(()=>{const f=actFechas(p);return !!f.ini&&!(f.fin&&f.fin<HOY)})()));
 if(a)return{act:true,why:(a.est==='En curso'?'en curso: ':'con fecha de inicio: ')+a.nom};
 const n=DB.idi.filter(x=>x.profe===nom&&x.est==='Activa').length;if(n)return{act:true,why:n+' alumno'+(n===1?'':'s')+' de idiomas'};
 const b=DB.beca.find(b=>b.inst===nom&&b.veredicto==='Aprobada'&&b.est==='En curso');if(b)return{act:true,why:'beca en curso: '+b.nom};
 return{act:false,why:'sin nada en curso ni con fecha de inicio'}}

function facturadoProv(n){

 if(document.getElementById('v_portales')&&accOk()){const B=portalesLeer(p.nom);DB.acc=(DB.acc||[]).filter(a=>!(a.prov&&provPn(a.prov)===provPn(p.nom))).concat(B)}

function delProv(nom){
 confirmar(`Vas a eliminar el proveedor <b>${esc(nom)}</b> de la lista. Las capacitaciones que lo mencionan no se modifican.`,
  `()=>{DB.prov=DB.prov.filter(x=>x.nom!=='${js(nom)}');guardar();refresh();toast('Proveedor eliminado')}`)}
/* ═════ Proveedores: evitar duplicados con otro nombre ═════ */
const provPn=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const PROV_STOP=new Set(['de','del','la','las','los','el','y','e','sa','s','a','srl','sau','sas','ltda','inc','the']);
const provTok=t=>provPn(t).split(' ').filter(w=>w&&!PROV_STOP.has(w));
const provGenerico=n=>/^(a definir|interna|interno|beca)$/i.test(String(n||'').trim());
function provLev(a,b){const m=a.length,n=b.length;if(!m||!n)return 0;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return 1-p[n]/Math.max(m,n)}
function provSimil(a,b){   /* ¿se parecen tanto como para ser el mismo proveedor? */
 const A=provTok(a),B=provTok(b);if(!A.length||!B.length)return false;
 const sa=[...A].sort().join(' '),sb=[...B].sort().join(' ');if(sa===sb)return true;
 const[C,L]=A.length<=B.length?[A,B]:[B,A];
 if(C.length>=2&&C.every(t=>L.some(u=>u===t||provLev(t,u)>=.8)))return true;                               /* "Bolsa Comercio" dentro de "Bolsa de Comercio de Rosario" */
 if(A.length===1&&B.length===1)return provLev(A[0],B[0])>=.8;
 if(A.length===B.length&&A.every(t=>B.some(u=>provLev(t,u)>=.8))&&B.every(u=>A.some(t=>provLev(t,u)>=.8)))return true;   /* error de tipeo */
 const ini=x=>x.map(w=>w[0]).join('');const ac=(L.length>=2?ini(L):''),sing=C.length===1?C[0]:'';   /* BCR = Bolsa de Comercio de Rosario */
 return !!(sing&&sing.length>=3&&ac===sing)}
function provParecidos(v,excluir){const pv=provPn(v);return DB.prov.filter(x=>!provGenerico(x.nom)&&provPn(x.nom)!==pv&&x.nom!==excluir&&provSimil(v,x.nom))}
const provCuenta=n=>DB.plan.filter(p=>p.prov===n).length+DB.idi.filter(x=>x.profe===n).length+DB.beca.filter(b=>b.inst===n).length;
/* antes de guardar: si lo escrito se parece a un proveedor que ya existe, se pregunta ahí mismo (sin perder lo que se estaba cargando) */
function provAsk(inputId,done,actual){
 const inp=document.getElementById(inputId);if(!inp)return false;const v=inp.value.trim();
 if(!v||provGenerico(v))return false;
 const ex=DB.prov.find(x=>provPn(x.nom)===provPn(v));if(ex){inp.value=ex.nom;return false}   /* mismo nombre con otras mayúsculas o tildes: se usa el ya cargado */
 if(actual&&provPn(actual)===provPn(v))return false;
 if(window._provOk===provPn(v))return false;
 const c=provParecidos(v);if(!c.length)return false;
 let box=document.getElementById(inputId+'_ask');if(!box){box=document.createElement('div');box.id=inputId+'_ask';(inp.closest('.f')||inp.parentElement).insertAdjacentElement('afterend',box)}
 window._provDone=done;box.className='aviso w';box.style.cssText='margin-top:8px;grid-column:1 / -1';
 box.innerHTML=`<b>¿Es este proveedor?</b> Escribiste «${esc(v)}» y ya tenés cargado:<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${c.slice(0,4).map(x=>`<button type="button" class="btn s" onclick="provElegir('${inputId}','${js(x.nom)}')">Sí, es «${esc(x.nom)}» <span style="opacity:.75;font-weight:400">· ${provCuenta(x.nom)} cap.</span></button>`).join('')}<button type="button" class="btn n s" onclick="provOtro('${inputId}')">No, es otro proveedor</button></div>`;
 box.scrollIntoView({block:'center',behavior:'smooth'});return true}   /* true = hay una pregunta abierta: quien llama espera */
function provElegir(inputId,nom){const i=document.getElementById(inputId);if(i)i.value=nom;const b=document.getElementById(inputId+'_ask');if(b)b.remove();const f=window._provDone;window._provDone=null;f&&f()}
function provOtro(inputId){const i=document.getElementById(inputId);window._provOk=provPn(i?i.value:'');const b=document.getElementById(inputId+'_ask');if(b)b.remove();const f=window._provDone;window._provDone=null;f&&f()}
/* unir dos proveedores que son el mismo */
function provDuplicados(){const L=DB.prov.filter(x=>!provGenerico(x.nom)),ign=new Set((DB.cfg.provNoDup||[])),out=[];
 for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){if(provSimil(L[i].nom,L[j].nom)&&!ign.has([L[i].nom,L[j].nom].sort().join('|')))out.push([L[i],L[j]])}return out}
function provUnirForm(dest,orig){const d=DB.prov.find(x=>x.nom===dest),o=DB.prov.find(x=>x.nom===orig);if(!d||!o)return;
 const n=provCuenta(orig),nf=DB.fact.filter(f=>f.prov===orig).length+DB.fidi.filter(f=>f.profe===orig).length;
 modal(cab('Unir proveedores','')+`<div class="mdl-b"><div class="aviso" style="margin-bottom:12px">Todo lo de <b>${esc(orig)}</b> pasa a <b>${esc(dest)}</b>: <b>${n}</b> capacitación${n===1?'':'es'} / alumnos / becas y <b>${nf}</b> factura${nf===1?'':'s'}. Los datos de contacto se juntan, y después «${esc(orig)}» se borra de la lista.</div>
  <div class="acts"><button class="btn" onclick="provUnir('${js(dest)}','${js(orig)}')">Unir en «${esc(dest)}»</button><button class="btn n" onclick="cerrar()">Cancelar</button></div></div>`,'sm')}
function provUnir(dest,orig){const d=DB.prov.find(x=>x.nom===dest),o=DB.prov.find(x=>x.nom===orig);if(!d||!o)return;
 DB.plan.forEach(p=>{if(p.prov===orig)p.prov=dest});DB.fact.forEach(f=>{if(f.prov===orig)f.prov=dest});DB.fidi.forEach(f=>{if(f.profe===orig)f.profe=dest});DB.idi.forEach(x=>{if(x.profe===orig)x.profe=dest});DB.beca.forEach(b=>{if(b.inst===orig)b.inst=dest});
 (DB.comp||[]).forEach(c=>{if(c.prov===orig)c.prov=dest});
 d.tipos=[...new Set([...(d.tipos||[]),...(o.tipos||[])])];['tel','cuit','contacto'].forEach(k=>{if(!d[k]&&o[k])d[k]=o[k]});
 const ms=[...new Set([d.mail,...(d.mails||[]),o.mail,...(o.mails||[])].map(x=>String(x||'').trim()).filter(Boolean))];if(ms.length){d.mail=ms[0];d.mails=ms}
 if(o.notas)d.notas=(d.notas?d.notas+'\n':'')+o.notas;
 DB.prov=DB.prov.filter(x=>x!==o);guardar();cerrar();refresh();toast('Unidos: «'+orig+'» ahora es «'+dest+'»')}
function provNoDup(a,b){DB.cfg.provNoDup=DB.cfg.provNoDup||[];DB.cfg.provNoDup.push([a,b].sort().join('|'));guardar();refresh()}

 return `<div class="card" style="border-color:var(--naranja);margin-bottom:16px"><div class="card-h"><h2>Posibles duplicados (${D.length})</h2><div class="n">nombres parecidos: ¿es el mismo proveedor?</div></div><div class="card-b flush"><div class="scroll"><table><thead><tr><th>Un nombre</th><th>Otro nombre</th><th></th></tr></thead><tbody>

   <td style="white-space:nowrap"><button class="btn s" onclick="provUnirForm('${js(a.nom)}','${js(b.nom)}')">Unir en «${esc(a.nom.length>22?a.nom.slice(0,21)+'…':a.nom)}»</button> <button class="btn s" onclick="provUnirForm('${js(b.nom)}','${js(a.nom)}')">Unir en «${esc(b.nom.length>22?b.nom.slice(0,21)+'…':b.nom)}»</button> <button class="btn n s" onclick="provNoDup('${js(a.nom)}','${js(b.nom)}')">No son el mismo</button></td></tr>`).join('')}</tbody></table></div></div></div>`}
/* ═════ Proveedores: datos del Excel completado (contacto, mails, teléfono, CUIT y notas) ═════
   Solo se completa lo que el Excel trae; lo que está en blanco no se toca ni se inventa. */

const NOM_VN={'comercial':'Comercial','corporativas':'Áreas corporativas','back office':'Back Office','tecnología':'IT','tecnologia':'IT'};
const NOM_ESP=['Amauta','BIOND','A definir'];
const nomKey=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-z]+/g)?.sort().join(' ')||'';
const xlDate=v=>{if(v===''||v==null)return '';
 if(v instanceof Date)return isNaN(v)?'':v.toISOString().slice(0,10);
 if(typeof v==='number'&&v>20000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
 const m=String(v).match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
 const d=String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return d?`${d[3]}-${d[2].padStart(2,'0')}-${d[1].padStart(2,'0')}`:''};

/* lee las filas del Excel de nómina (hoja "Nomina": Usuario, Legajo, Nombre, Apellido, Sociedad, Área, Puesto, Líder, Vertical…) */
function parseNomRows(rows){
 const hi=rows.findIndex(r=>r.some(c=>/^legajo$/i.test(String(c).trim()))&&r.some(c=>/^nombre$/i.test(String(c).trim())));
 if(hi<0)return null;
 const H=rows[hi].map(h=>String(h).trim().toLowerCase()),ix=rx=>H.findIndex(h=>rx.test(h));
 const c={us:ix(/^usuario|^mail|^correo/),lg:ix(/^legajo/),no:ix(/^nombre$/),ap:ix(/^apellido/),so:ix(/^sociedad/),un:ix(/^.rea$/),
  po:ix(/^puesto|^posici/),li:ix(/^l.der/),ve:ix(/^vertical/),in:ix(/ingreso/),ci:ix(/^ciudad/),te:ix(/^tel/)};
 const o=[];
 rows.slice(hi+1).forEach(r=>{
  const no=String(r[c.no]||'').trim(),ap=String(r[c.ap]||'').trim();
  if(!no&&!ap)return;if(/#n\/a/i.test(no+ap))return;
  const ve=String(r[c.ve]||'').trim();
  o.push({legajo:String(r[c.lg]||'').trim(),nombre:(ap+' '+no).trim(),mail:String(r[c.us]||'').trim(),
   sociedad:String(r[c.so]||'').trim(),unidad:String(r[c.un]||'').trim(),vertical:ve,vn:NOM_VN[ve.toLowerCase()]||'',
   lider:String(r[c.li]||'').trim(),posicion:String(r[c.po]||'').trim(),ingreso:xlDate(r[c.in]),
   ciudad:String(r[c.ci]||'').trim(),telefono:String(r[c.te]||'').trim()})});
 return o;
}

/* compara el archivo contra la nómina actual: ingresos, egresos y cambios */
function diffNom(recs){
 const byLg={},byMl={},byKey={};
 DB.nom.forEach(p=>{if(p.legajo)byLg[String(p.legajo)]=p;if(p.mail)byMl[p.mail.toLowerCase()]=p;byKey[nomKey(p.nombre)]=p});
 const vistos=new Set(),altas=[],match=[];
 recs.forEach(r=>{
  const sol=q=>{const A=new Set(nomKey(r.nombre).split(' '));return nomKey(q.nombre).split(' ').some(t=>A.has(t))};
  const pl=r.legajo&&byLg[r.legajo],pm=r.mail&&byMl[r.mail.toLowerCase()];
  let p=(pl&&sol(pl)?pl:null)||byKey[nomKey(r.nombre)]||(pm&&sol(pm)?pm:null)||null;
  if(!p){const T=new Set(nomKey(r.nombre).split(' ').filter(Boolean)),cs=DB.nom.filter(q=>{const S=new Set(nomKey(q.nombre).split(' ').filter(Boolean));return Math.min(T.size,S.size)>=2&&([...T].every(t=>S.has(t))||[...S].every(t=>T.has(t)))&&!vistos.has(q.nombre)});   /* mismo nombre con uno de más (ej. María Nazarena / Nazarena) */
   if(cs.length===1)p=cs[0]}
  if(!p){altas.push(r);return}
  if(r._ing){vistos.add(p.nombre);return}
  if(vistos.has(p.nombre))return;vistos.add(p.nombre);
  const dif=[],cmp=(lbl,a,b,k)=>{const A=String(a||'').trim(),B=String(b||'').trim();
   if(B&&(k?nomKey(A)!==nomKey(B):A.toLowerCase()!==B.toLowerCase()))dif.push({c:lbl,a:A||'—',b:B})};
  cmp('Sociedad',p.sociedad,r.sociedad);cmp('Área',p.unidad,r.unidad);cmp('Cambio de rol',p.posicion,r.posicion);cmp('Cambio de líder',p.lider,r.lider,1);
  if(r.vn&&!NOM_ESP.includes(p.vn)&&p.vn!==r.vn)dif.push({c:'Vertical',a:p.vn||'—',b:r.vn});
  match.push({p,r,dif})});
 const sinMail=recs.filter(r=>!/^92/.test(String(r.legajo||''))&&!mailCorp(r.mail));
 return{total:recs.length,altas,match,sinMail,cambios:match.filter(m=>m.dif.length),bajas:DB.nom.filter(p=>!vistos.has(p.nombre)&&!/^92/.test(String(p.legajo||''))),externos:DB.nom.filter(p=>!vistos.has(p.nombre)&&/^92/.test(String(p.legajo||'')))};
}

function leerIngresos(wb,recs){
 const n=wb.SheetNames.find(x=>/ingres/i.test(x));if(!n)return [];
 const R=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''}),hi=R.findIndex(r=>r.some(c=>/^fechadeingreso$|^fecha de ingreso$/i.test(String(c).trim()))&&r.some(c=>/^apellido$/i.test(String(c).trim())));if(hi<0)return [];
 const H=R[hi].map(h=>String(h).trim().toLowerCase()),ix=rx=>H.findIndex(h=>rx.test(h)),c={fe:ix(/^fechadeingreso$|^fecha de ingreso$/),ap:ix(/^apellido$/),no:ix(/^nombre$/),po:ix(/^posici/),so:ix(/^sociedad/),ci:ix(/^ciudad/)};
 const lim=new Date(HOY+'T12:00:00');lim.setDate(lim.getDate()-75);const desde=lim.toISOString().slice(0,10),ya=new Set(recs.map(r=>nomKey(r.nombre))),out=[];
 R.slice(hi+1).forEach(r=>{const ap=String(r[c.ap]||'').trim(),no=String(r[c.no]||'').trim();if(!ap&&!no)return;const ing=xlDate(r[c.fe]);if(!ing||String(ing).slice(0,10)<desde)return;
  const nombre=(ap+' '+no).trim();if(ya.has(nomKey(nombre)))return;ya.add(nomKey(nombre));
  const so0=String(r[c.so]||'').trim(),so=(DB.nom.map(p=>p.sociedad).find(x=>x&&so0&&x.toLowerCase().startsWith(so0.toLowerCase()))||so0);
  out.push({legajo:'',nombre,mail:'',sociedad:so,unidad:'',vertical:'',vn:'',lider:'',posicion:String(r[c.po]||'').trim(),ingreso:ing,ciudad:String(r[c.ci]||'').trim(),telefono:'',_ing:true})});return out}
function cargarNom(file){

/* borra a alguien de la app: nómina, historial de capacitaciones, participaciones y asistencia */
function removePersona(nombre){
 const lg=(DB.nom.find(p=>p.nombre===nombre)||{}).legajo;
 DB.nom=DB.nom.filter(p=>p.nombre!==nombre);
 DB.hist=DB.hist.filter(h=>h.n!==nombre);
 DB.plan.forEach(a=>{a.parts=(a.parts||[]).filter(x=>x.nom!==nombre);
  Object.values(a.asis||{}).forEach(m=>{delete m[nombre];if(lg)delete m[lg]})});
 if(DB.pers&&!Array.isArray(DB.pers))delete DB.pers[nombre];
 DB.idi.filter(x=>x.nom===nombre&&x.est!=='Baja').forEach(x=>{x.est='Baja';x.baja=x.baja||((DB.cfg&&DB.cfg.hoy)||HOY)});
}
function resolverPers(nomIn,mails){

 for(const ml of (mails||[])){const p=DB.nom.find(x=>x.mail&&x.mail.toLowerCase()===ml.toLowerCase());if(p&&tk(nomIn).some(t=>new Set(tk(p.nombre)).has(t)))return p}

 const T=tk(nomIn);if(T.length<2)return null;
 const TS=new Set(T),c=DB.nom.filter(p=>{const S=new Set(tk(p.nombre));return T.every(t=>S.has(t))||(S.size>=2&&[...S].every(t=>TS.has(t)))});return c.length===1?c[0]:null}
/* reubica en la nómina a los participantes que quedaron sin legajo (y les pasa la asistencia que tenían) */
function planRelink(){let n=0;
 DB.plan.forEach(p=>p.parts.forEach(x=>{if(x.lg)return;const r=resolverPers(x.nom,[]);if(!r)return;
  const k0=x.nom,f=fill(r.nombre);Object.assign(x,{lg:f.lg,nom:f.nom,soc:f.soc,un:f.un,vert:f.vert,vn:f.vn,lider:f.lider});
  Object.keys(p.asis||{}).forEach(eid=>{const m=p.asis[eid];if(m&&m[k0]!==undefined&&f.lg){m[f.lg]=m[k0];delete m[k0]}});n++}));
 return n}
function idiRelink(){let n=0;
 DB.idi.forEach(x=>{if(x.lg)return;const p=buscarPersona(x.nom);if(!p)return;const old=x.nom;
  Object.assign(x,{lg:p.legajo||'',nom:p.nombre,soc:p.sociedad,vn:p.vn||'',un:p.unidad||'',lider:p.liderC||p.lider||''});

function recalcEq(){
 const key=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-z]+/g)?.sort().join(' ')||'';
 const K={};DB.nom.forEach(p=>K[key(p.nombre)]=p.nombre);
 DB.nom.forEach(p=>p.liderC=p.lider?(K[key(p.lider)]||p.lider):'');
 const dir={};DB.nom.forEach(p=>{if(p.liderC)(dir[p.liderC]=dir[p.liderC]||[]).push(p.nombre)});
 const casc=(l,v)=>{v=v||new Set();const o=[];
  (dir[l]||[]).forEach(n=>{if(v.has(n))return;v.add(n);o.push(n);o.push(...casc(n,v))});return o};
 Object.keys(dir).forEach(l=>{
  const ref=DB.nom.find(p=>p.nombre===l);if(!ref)return;
  const ext=casc(l);if(ext.length<2||ext.length>250)return;
  const g=DB.nom.filter(p=>ext.includes(p.nombre));
  const mo=k=>{const c={};g.forEach(x=>c[x[k]]=(c[x[k]]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]};
  let e=DB.eq.find(x=>x.lider===l);
  if(!e){e={id:uid('EQ'),lider:l,gente:[],dir:[],sub:[]};DB.eq.push(e)}
  Object.assign(e,{pos:ref.posicion||'',gente:ext,dir:dir[l].slice(),sub:dir[l].filter(x=>(dir[x]||[]).length),
   n:ext.length,nd:dir[l].length,vn:mo('vn'),un:mo('unidad'),soc:mo('sociedad')})});
}

/* ═══════════════════════ SUPABASE · lectura y guardado ═══════════════════════ */
const SB={cli:null,snap:{},snapH:{},sucio:false,corriendo:false,otra:false,t:null,err:null,reint:null,ultimo:null};
const SBORD={proveedores:'orden',colaboradores:'orden',partidas_presupuesto:'orden',capacitaciones:'orden',capacitacion_participantes:'orden',capacitacion_encuentros:'id',
 capacitacion_asistencia:['encuentro_id','participante_id'],capacitacion_gastos:'orden',facturas:'orden',becas:'orden',beca_rendiciones:'id',idiomas_alumnos:'orden',idiomas_pagos:'id',
 idiomas_facturas:'orden',idiomas_factura_alumnos:'id',personas_historico:'nombre',historico_capacitaciones:'orden',nomina_cargas:'id',configuracion:'clave',centros_costo:'id',accesos:'orden'};
const SBPAG=1000,SBLOTE=400,SBSEP='\u0001';
const sbPk=(t,r)=>SBPK[t].map(c=>r[c]).join(SBSEP);
const sbJ=r=>JSON.stringify(r);

async function sbTabla(t){
 const ord=[].concat(SBORD[t]);let out=[],desde=0,total=null;
 for(;;){
  let q=SB.cli.from(t).select('*',{count:'exact'});ord.forEach(c=>{q=q.order(c,{ascending:true})});
  const{data,error,count}=await q.range(desde,desde+SBPAG-1);
  if(error)throw error;
  if(total===null&&count!==null&&count!==undefined)total=count;
  out=out.concat(data||[]);
  if(!data||!data.length)break;
  if(total!==null){if(out.length>=total)break}else if(data.length<SBPAG)break;
  desde=out.length}
 return out}
/* la tabla accesos es nueva: si todavía no está creada en la base, la app sigue andando y avisa que falta actualizar */
async function sbProbarAccesos(){
 try{const{error}=await SB.cli.from('accesos').select('id').range(0,0);
  if(error){SB.accOk=false;return}
  SB.accOk=true;if(!SBORDEN.includes('accesos'))SBORDEN.push('accesos');if(!SBLEER.includes('accesos'))SBLEER.push('accesos')}
 catch(e){SB.accOk=false}}
/* si los accesos vinieron del documento y ya existe la tabla, se fuerza el guardado en la tabla */
function sbAccMig(){if(typeof DB!=='undefined'&&DB&&DB._accMig){delete DB._accMig;if(SB.snap.accesos)SB.snap.accesos=new Map();if(SB.snap.configuracion)SB.snap.configuracion.set('accesos','forzar');guardar()}}   /* se reescribe la tabla y se vacía el documento viejo */
async function sbLeerTodo(){const T={};await Promise.all(SBLEER.map(async t=>{T[t]=await sbTabla(t)}));return T}

/* foto de lo que hay en la base: sirve para mandar solo lo que cambió */
function sbSnapshot(DBx){
 const{R,H}=sbToRows(DBx);SB.snap={};SB.snapH={};
 SBORDEN.forEach(t=>{const m=new Map();(R[t]||[]).forEach(r=>m.set(sbPk(t,r),sbJ(r)));SB.snap[t]=m});
 Object.keys(SBHIJOS).forEach(t=>{const m=new Map();Object.keys(H[t]).forEach(pid=>m.set(pid,sbJ(H[t][pid])));SB.snapH[t]=m})}

const sbTrozos=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
async function sbUpsert(t,rows){for(const c of sbTrozos(rows,SBLOTE)){const{error}=await SB.cli.from(t).upsert(c,{onConflict:SBPK[t].join(',')});if(error)throw error}}
async function sbInsert(t,rows){for(const c of sbTrozos(rows,SBLOTE)){const{error}=await SB.cli.from(t).insert(c);if(error)throw error}}
async function sbBorrarIn(t,col,vals){for(const c of sbTrozos(vals,SBLOTE)){const{error}=await SB.cli.from(t).delete().in(col,c);if(error)throw error}}

/* hijos de un padre: se reemplazan completos cuando cambia alguno */
async function sbHijos(t,padres,Hp){
 const snap=SB.snapH[t]||(SB.snapH[t]=new Map()),camb=[];
 padres.forEach((_r,pid)=>{const j=sbJ(Hp[pid]||(t==='capacitaciones'?{}:[]));if(snap.get(pid)!==j)camb.push([pid,j])});
 if(!camb.length)return;
 const ids=camb.map(c=>c[0]);
 for(const[tabla,col]of SBHIJOS[t])await sbBorrarIn(tabla,col,ids);
 if(t==='capacitaciones'){
  const todo=n=>ids.flatMap(id=>(Hp[id]&&Hp[id][n])||[]);
  await sbInsert('capacitacion_participantes',todo('participantes'));
  await sbInsert('capacitacion_encuentros',todo('encuentros'));
  await sbInsert('capacitacion_asistencia',todo('asistencia'));
  await sbInsert('capacitacion_gastos',todo('gastos'))}
 else await sbInsert(SBHIJOS[t][0][0],ids.flatMap(id=>Hp[id]||[]));
 camb.forEach(([pid,j])=>snap.set(pid,j))}

/* guarda en la base todo lo que cambió desde la última vez */
function sbHay(R,H){
 for(const t of SBORDEN){const m=new Map();(R[t]||[]).forEach(r=>m.set(sbPk(t,r),r));const v=SB.snap[t]||new Map();
  if(m.size!==v.size)return true;for(const[k,r]of m)if(v.get(k)!==sbJ(r))return true}
 for(const t of Object.keys(SBHIJOS)){const v=SB.snapH[t]||new Map();for(const pid of Object.keys(H[t]))if(v.get(pid)!==sbJ(H[t][pid]))return true}
 return false}
async function sbSync(pre){
 const{R,H}=pre||sbToRows(DB),actual={};
 for(const t of SBORDEN){
  const filas=R[t]||[],m=new Map();filas.forEach(r=>m.set(sbPk(t,r),r));actual[t]=m;
  const viejo=SB.snap[t]||(SB.snap[t]=new Map()),camb=[];
  m.forEach((r,k)=>{const j=sbJ(r);if(viejo.get(k)!==j)camb.push([k,r,j])});
  if(camb.length){await sbUpsert(t,camb.map(c=>c[1]));camb.forEach(([k,,j])=>viejo.set(k,j))}
  if(SBHIJOS[t])await sbHijos(t,m,H[t])}
 /* lo que se borró en la app se borra en la base (hijos y facturas primero) */
 for(const t of[...SBORDEN].reverse()){
  if(t==='ejercicios'||t==='configuracion')continue;
  const viejo=SB.snap[t],m=actual[t],faltan=[...viejo.keys()].filter(k=>!m.has(k));
  if(!faltan.length)continue;
  if(SBPK[t].length===1)await sbBorrarIn(t,SBPK[t][0],faltan);
  else for(const k of faltan){const p=k.split(SBSEP);let q=SB.cli.from(t).delete();SBPK[t].forEach((c,i)=>{q=q.eq(c,p[i])});const{error}=await q;if(error)throw error}
  faltan.forEach(k=>viejo.delete(k));
  if(SB.snapH[t])faltan.forEach(k=>SB.snapH[t].delete(k))}}

/* guardar: se llama desde toda la app; junta los cambios y manda solo lo que cambió */
function guardar(){if(!SB.cli||!SB.listo)return;clearTimeout(SB.t);SB.t=setTimeout(sbFlush,1200)}
async function sbFlush(){
 if(!SB.cli||!SB.listo)return;

 try{
  const pre=sbToRows(DB);

 }catch(e){
  console.warn('guardado',e);SB.err=e;SB.sucio=true;sbEstado('error',e);

 }finally{SB.corriendo=false;if(SB.otra){SB.otra=false;setTimeout(sbFlush,300)}}}

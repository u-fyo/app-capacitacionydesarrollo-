<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 /* Paleta manual de marca fyo */
 --celeste:#008EAA; --celeste-d:#0B4855; --celeste-l:#e4f4f8; --celeste-xl:#f4fbfd;
 --cian:#15D7DF; --azul:#2F6FDE; --violeta:#7C5CD6; --violeta-l:#7C5CD6;
 --naranja:#E09B00; --rojo:#E5484D; --verde:#22A06B; --verde-l:#22A06B;
 --amarillo:#E09B00; --rosa:#E5484D; --gris:#A9BFC5;
 --tinta:#1E2A2E; --tinta-2:#5B6B70;
 --bg:#f2f6f8; --linea:#e2eaee; --linea-2:#f0f4f6;
 --r:10px; --sombra:0 1px 2px rgba(58,61,64,.05),0 4px 16px rgba(0,142,170,.06);
 --nav-w:238px; --nav-w-min:64px;
}
html,body{height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--tinta);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--celeste);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cfdde3;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2.5px solid var(--naranja);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td .nom,td .sub2{white-space:normal}

/* ══ APP SHELL ══ */
.app{display:flex;min-height:100vh}
.nav{width:var(--nav-w);background:#fff;border-right:1px solid var(--linea);display:flex;flex-direction:column;
 position:fixed;inset:0 auto 0 0;z-index:50;transition:width .22s ease}
body.min .nav{width:var(--nav-w-min)}
.nav-top{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;min-height:64px}
.logo{flex-shrink:0}
.nav-sub{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--gris);font-weight:600;white-space:nowrap;overflow:hidden}
body.min .nav-sub{display:none}
.nav-ej{margin:0 12px 14px;position:relative}
body.min .nav-ej{margin:0 8px 12px}
.nav-ej label{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--gris);font-weight:600;display:block;margin-bottom:4px}
body.min .nav-ej label{display:none}
.nav-ej select{width:100%;border:1.5px solid var(--linea);border-radius:8px;padding:7px 9px;font-size:12.5px;
 font-weight:600;background:var(--celeste-xl);color:var(--celeste-d);cursor:pointer;outline:none}
body.min .nav-ej select{padding:7px 4px;font-size:10.5px;text-align:center}
.nav ul{list-style:none;padding:0 10px;flex:1;overflow-y:auto}
.nav li.grp{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--gris);font-weight:600;
 padding:12px 10px 5px;pointer-events:none}
body.min .nav li.grp{font-size:0;padding:8px 0 4px;border-top:1px solid var(--linea-2);margin:4px 8px 0}
.nav li>button{width:100%;display:flex;align-items:center;gap:11px;border:none;background:none;padding:9px 10px;
 border-radius:8px;font-size:13px;font-weight:500;color:var(--tinta-2);cursor:pointer;text-align:left;margin-bottom:2px;transition:.13s}
.nav li>button:hover{background:var(--celeste-xl);color:var(--celeste-d)}
.nav li>button.on{background:var(--celeste-l);color:var(--celeste-d);font-weight:600}
.nav .ico{width:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav .txt{white-space:nowrap;overflow:hidden}
body.min .nav .txt{display:none}
body.min .nav li>button{justify-content:center;padding:10px 0}
.nav-foot{padding:10px;border-top:1px solid var(--linea-2)}
.nav-tog{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--linea);background:#fff;
 padding:8px 10px;border-radius:8px;font-size:12px;color:var(--gris);cursor:pointer;font-weight:500}
.nav-tog:hover{border-color:var(--celeste);color:var(--celeste-d)}
body.min .nav-tog{justify-content:center}
body.min .nav-tog .txt{display:none}
.main{flex:1;margin-left:var(--nav-w);transition:margin .22s ease;min-width:0}
body.min .main{margin-left:var(--nav-w-min)}
.wrap{max-width:1360px;margin:0 auto;padding:22px 26px 70px}
.scrim{display:none}
@media(max-width:860px){
 .nav{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.18)}
 body.open .nav{transform:none}
 .main{margin-left:0}
 body.open .scrim{display:block;position:fixed;inset:0;background:rgba(58,61,64,.4);z-index:45}
 .wrap{padding:16px 14px 60px}
 .mob{display:flex!important}
}
.mob{display:none;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--linea);padding:12px 14px;position:sticky;top:0;z-index:40}
.mob button{border:1px solid var(--linea);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}

/* ══ PAGE HEAD ══ */
.head{margin-bottom:20px}
.eyebrow{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--gris);font-weight:600;margin-bottom:3px}
h1{font-size:24px;font-weight:600;letter-spacing:-.5px;line-height:1.2}
h1 .par{color:var(--celeste);font-weight:300}
.sub{font-size:12.5px;color:var(--gris);margin-top:5px;max-width:760px;line-height:1.55}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gris);font-weight:600;
 background:none;border:none;cursor:pointer;padding:4px 0;margin-bottom:8px}
.back:hover{color:var(--celeste-d)}

/* ══ CARDS ══ */
.card{background:#fff;border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);margin-bottom:16px}
.card-h{padding:14px 18px;border-bottom:1px solid var(--linea-2);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.card-h h2{font-size:14px;font-weight:600;letter-spacing:-.1px}
.card-h .n{font-size:11.5px;color:var(--gris)}
.card-b{padding:18px}
.card-b.flush{padding:0}
.grid{display:grid;gap:16px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bcard{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.bcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-1px)}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

/* ══ MÉTRICAS (formato único) ══ */
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:16px}
.met{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px 16px;box-shadow:var(--sombra);
 position:relative;overflow:hidden}
.met:before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--linea-2)}
.met-tot:before{background:var(--celeste)}.met-eje:before{background:var(--azul)}
.met-dis:before{background:var(--verde)}.met-exc:before{background:var(--rojo)}
.met-fue:before{background:var(--naranja)}.met-per:before{background:var(--violeta)}
.met.link{cursor:pointer;transition:.14s}
.met.link:hover{border-color:var(--celeste);box-shadow:0 3px 14px rgba(0,142,170,.14)}
.met.link:after{content:'→';position:absolute;top:11px;right:13px;color:var(--celeste);font-size:13px;opacity:.5}
.met.link:hover:after{opacity:1}
.met .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--gris);font-weight:600;line-height:1.35;min-height:26px}
.met .val{font-size:21px;font-weight:600;letter-spacing:-.6px;margin:3px 0 2px;line-height:1.15;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.met .val.lg{font-size:18px}
.met .val.xl{font-size:16px}
.met .ref{font-size:11px;color:var(--gris);line-height:1.4}
.met .ref b{color:var(--tinta);font-weight:600}
.met.ok .val{color:var(--verde)} .met.mal .val{color:var(--rojo)} .met.warn .val{color:var(--naranja)}
.met.cel .val{color:var(--celeste-d)}


/* ══ TABLAS ══ */
.scroll{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:9px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;
 color:var(--gris);background:var(--celeste-xl);border-bottom:1px solid var(--linea);white-space:nowrap;position:sticky;top:0;z-index:3}
th.r,td.r{text-align:right}
td{padding:10px 14px;border-bottom:1px solid var(--linea-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover{background:var(--celeste-xl)}
tfoot td{background:var(--celeste-xl);font-weight:600;border-top:1px solid var(--linea)}
.nom{font-weight:600;line-height:1.3}
.sub2{font-size:11px;color:var(--gris);margin-top:1px}
.vacio{padding:38px 20px;text-align:center;color:var(--gris)}
.vacio b{display:block;color:var(--tinta);font-size:14px;font-weight:600;margin-bottom:4px}

/* ══ CHIPS / TAGS ══ */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}

.c-pen{background:#fff4e2;color:#95610b} .c-can{background:#fdeaea;color:#a81f1c}
.c-dif{background:#f2ebfa;color:#5b2e8f} .c-gris{background:#f1f3f4;color:var(--tinta-2)}
.c-fue{background:#ffeadd;color:#b1440a} .c-int{background:#eef7e9;color:#4a8b30}
.c-ext{background:#e7f1fc;color:#15558f} .c-baja{background:#f1f3f4;color:var(--gris)}
.c-pag{background:#e8f6ec;color:#2b7a45} .c-carg{background:var(--celeste-l);color:var(--celeste-d)}

.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ══ FILTROS ══ */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:14px 18px;background:#fff;
 border:1px solid var(--linea);border-radius:12px;margin-bottom:16px;box-shadow:var(--sombra)}

.fgrid .fg label{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--gris);font-weight:600}
.fgrid .fi{width:100%}
.fbar{display:flex;gap:8px;align-items:center;width:100%;margin-bottom:10px}
.fbar .busca{flex:1}

.fchips .fx{display:inline-flex;align-items:center;gap:6px;background:var(--celeste-l);color:var(--celeste-d);
 border-radius:20px;padding:3px 6px 3px 10px;font-size:11px;font-weight:600}
.fchips .fx button{border:none;background:rgba(0,142,170,.18);color:var(--celeste-d);width:16px;height:16px;
 border-radius:50%;cursor:pointer;font-size:10px;line-height:1;padding:0}
.fi{border:1.5px solid var(--linea);border-radius:8px;padding:7px 10px;font-size:12.5px;background:#fff;outline:none;transition:.14s}

select.fi{cursor:pointer}

 font-size:12.5px;font-weight:600;cursor:pointer;transition:.14s;white-space:nowrap}

.btn.g{background:#fff;color:var(--celeste-d)} .btn.g:hover{background:var(--celeste-l)}
.btn.n{border-color:var(--linea);background:#fff;color:var(--gris)} .btn.n:hover{color:var(--tinta);border-color:var(--gris)}

/* ══ BARRAS ══ */

/* ══ AVISOS ══ */

 border-radius:0 var(--r) var(--r) 0;padding:12px 16px;font-size:12.5px;line-height:1.6;margin-bottom:16px;color:var(--tinta-2)}

/* ══ TABS ══ */

.cal-h{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}

 text-transform:uppercase;letter-spacing:.7px;color:var(--gris)}

 align-items:center;justify-content:center;font-size:11px}

 border-radius:20px;padding:5px 13px;font-size:12px;font-weight:500;cursor:pointer;color:var(--tinta-2);transition:.14s}

.pchk .sub2{font-size:10.5px}
.ejenum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;
 background:var(--celeste);color:#fff;font-size:12px;font-weight:600;margin-right:8px}
@media print{
 .nav,.mob,.back,.btn,.filtros,.toast,.ov{display:none!important}
 .main{margin-left:0!important}
 .card{break-inside:avoid;box-shadow:none;border-color:#ccc}
 body{background:#fff;font-size:11px}
 .wrap{max-width:none;padding:0}
 .met{break-inside:avoid}
}
.vcard{background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra);
 border-top:4px solid var(--vc);padding:16px 18px 14px;cursor:pointer;transition:.16s;position:relative}
.vcard:hover{box-shadow:0 6px 22px rgba(0,142,170,.14);transform:translateY(-1px)}
.vc-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.vc-ico{width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--vc) 12%,#fff);
 color:var(--vc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vc-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--gris);font-weight:600}
.vc-nom{font-size:17px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
.vc-badge{position:absolute;top:12px;right:14px;background:var(--celeste);color:#fff;min-width:22px;height:22px;
 border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;padding:0 6px}
.vc-box{background:var(--gr2,#f6f9fb);border:1px solid var(--linea-2);border-radius:10px;padding:11px 13px;margin-bottom:12px}
.vc-row{display:flex;justify-content:space-between;font-size:10.5px;text-transform:uppercase;
 letter-spacing:.6px;color:var(--gris);font-weight:600}
.vc-row b{color:var(--tinta);font-size:12px}
.vc-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.vc-kpis>div{text-align:center}
.vc-kpis span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);font-weight:600}
.vc-kpis b{font-size:15px;font-weight:600;letter-spacing:-.3px}
.vc-acts{display:flex;gap:8px}
.vc-acts .btn{flex:1;text-align:center}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1.5px solid var(--linea);
 background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.14s}
.opt:hover{border-color:var(--celeste);background:var(--celeste-xl)}
.opt-n{width:22px;height:22px;border-radius:7px;background:var(--celeste-l);color:var(--celeste-d);
 display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:1px}
.opt-i{font-size:19px;line-height:1;flex-shrink:0}
.opt-t{display:block;font-weight:600;font-size:13.5px}
.opt-d{display:block;font-size:11.5px;color:var(--gris);line-height:1.45;margin-top:2px}
.drop{border:2px dashed var(--linea);border-radius:12px;padding:24px;text-align:center;background:var(--celeste-xl);cursor:pointer}
.drop:hover,.drop.dr{border-color:var(--celeste)}
.drop .t{font-weight:600;font-size:13.5px;margin-top:6px}
.drop .s{font-size:11.5px;color:var(--gris);margin-top:4px;line-height:1.5}
.bar{height:7px;background:var(--linea-2);border-radius:5px;overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;background:var(--celeste);border-radius:5px}
.bar i.full{background:var(--verde)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'▾';margin-left:auto;font-size:15px;color:var(--gris);transition:transform .15s}
.acc[open]>summary::after{transform:rotate(180deg)}
input.money{text-align:right}
.idi-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.idi-per{font-size:22px;font-weight:800;color:var(--tinta);line-height:1.1}
.idi-nav{display:flex;align-items:center;gap:6px}
.idi-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.idi-t{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--c);border-radius:12px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.idi-t:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-1px)}
.idi-t .n1{font-size:32px;font-weight:800;line-height:1;color:var(--c)}
.idi-t .l1{font-weight:600;font-size:12.5px;margin-top:8px}
.idi-t .s1{font-size:11px;color:var(--gris);margin-top:2px}
.idi-sec{font-size:13px;font-weight:700;margin:22px 0 10px;color:var(--tinta)}
.idi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.idi-d{background:#fff;border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.idi-d>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px}
.idi-d>summary::-webkit-details-marker{display:none}
.idi-d>summary::after{content:'▾';color:var(--gris);font-size:14px;transition:transform .15s}
.idi-d[open]>summary::after{transform:rotate(180deg)}
.idi-d[open]{box-shadow:0 6px 18px rgba(0,0,0,.07)}
.idi-d .dn{font-weight:700;font-size:13.5px}
.idi-d .dnum{font-size:24px;font-weight:800;line-height:1}
.idi-d .dl{border-top:1px solid var(--linea);padding:6px 16px 10px;max-height:340px;overflow:auto}
.idi-d .dl>div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--linea);font-size:12.5px}
.idi-d .dl>div:last-child{border-bottom:none}
.idi-t.idi-p{cursor:default}
.idi-t.idi-p:hover{box-shadow:none;transform:none}
.bgmes{display:flex;align-items:center;justify-content:center;gap:22px;margin:2px 0 14px}
.bgmes .m1{font-size:26px;font-weight:800;color:var(--tinta);line-height:1.1;text-align:center}
.bgmes .m2{font-size:12px;color:var(--gris);text-align:center}
.bgmes button{width:34px;height:34px;border-radius:50%;border:1px solid var(--linea);background:#fff;font-size:18px;cursor:pointer}
.bgmes button:disabled{opacity:.3;cursor:default}
.bgrow{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--linea)}
.bgrow:last-child{border-bottom:none}
.bgn{flex:1;min-width:0;display:flex;flex-direction:column}
.bgn b{font-size:13.5px}
.bgchk{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;padding:6px 10px;border:1px solid var(--linea);border-radius:20px;white-space:nowrap}
.bgchk input{width:17px;height:17px;margin:0;cursor:pointer}
.bgtot{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 2px;font-size:13px}
.hy{margin-top:14px;overflow:hidden}
.hy>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 18px}
.hy>summary::-webkit-details-marker{display:none}
.hy>summary::after{content:'▾';margin-left:auto;color:var(--gris);transition:transform .15s}
.hy[open]>summary::after{transform:rotate(180deg)}
.hy-y{background:var(--celeste-xl);color:var(--celeste-d);font-weight:800;border-radius:10px;padding:8px 13px;font-size:15px;white-space:nowrap}
.hy-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:11px 18px;border-top:1px solid var(--linea);align-items:start}
.hy-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hy-t b{font-size:13.5px}
.hy-n{font-weight:800;font-size:17px;color:var(--celeste-d);text-align:right;line-height:1}
.hy-n small{display:block;font-weight:500;font-size:10.5px;color:var(--gris)}
.hy-pp{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.pn{background:#fff;border:1px solid var(--linea);border-radius:20px;padding:2px 10px;font-size:11.5px;cursor:pointer}
.pn:hover{border-color:var(--celeste);background:var(--celeste-xl)}
.hy-it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--linea)}
.hy-it:first-of-type{border-top:none}
.ag{margin-bottom:14px;overflow:hidden}
.ag-h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px}
.ag-r{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 18px;border-top:1px solid var(--linea);cursor:pointer}
.ag-r:hover{background:var(--celeste-xl)}
.ag-r.pas{opacity:.5}
.ag-r.prox{background:var(--celeste-xl);box-shadow:inset 3px 0 0 var(--celeste-d)}
.ag-d{background:#fff;border:1px solid var(--linea);border-radius:12px;text-align:center;padding:7px 0;line-height:1.1}
.ag-d b{display:block;font-size:22px;color:var(--celeste-d)}
.ag-d span{font-size:10.5px;text-transform:uppercase;color:var(--gris);letter-spacing:.5px}
.ag-t{text-align:right;font-size:13px;white-space:nowrap}

/* ═══════════════════════════ IDENTIDAD VISUAL FYO ═══════════════════════════
   Paleta oficial, Poppins con interletrado −25, tarjetas redondeadas, un solo degradado: el fondo oficial.
   Colores: celeste #008EAA · acento2 #15D7DF · petróleo #0B4855 · noche #142C32 · carbón #1E2A2E · gris #5B6B70 · línea #D5DFE2 · niebla #EEF4F6 */
:root{
 --celeste:#008EAA; --celeste-d:#0B4855; --celeste-l:#EEF4F6; --celeste-xl:#EEF4F6;
 --petroleo:#0B4855; --noche:#142C32; --carbon:#1E2A2E; --niebla:#EEF4F6; --gris-claro:#A9BFC5;
 --cian:#15D7DF; --azul:#2F6FDE; --violeta:#7C5CD6; --violeta-l:#7C5CD6;
 --naranja:#E09B00; --rojo:#E5484D; --verde:#22A06B; --verde-l:#22A06B;
 --gris:#5B6B70; --tinta:#1E2A2E; --tinta-2:#5B6B70;
 --bg:#F2F6F7; --linea:#D5DFE2; --linea-2:#EEF4F6;
 --r:16px; --sombra:0 1px 2px rgba(20,44,50,.06); --sombra-h:0 4px 16px rgba(20,44,50,.10);
}
body{background:var(--bg);color:var(--carbon);font-size:13.5px;letter-spacing:-.025em}
input,select,textarea,button{letter-spacing:inherit}
:focus-visible{outline:2.5px solid var(--celeste);outline-offset:2px}
::-webkit-scrollbar-thumb{background:var(--linea)}

/* ── barra lateral: sólido Noche + logo blanco oficial ── */
.nav{background:var(--noche);border-right:none}
.nav .logo{height:36px;width:auto;display:block;filter:none}
.nav-top{padding:20px 18px 16px}
.nav-sub{font-size:11px;letter-spacing:-.025em;text-transform:none;font-weight:500;color:rgba(255,255,255,.62);line-height:1.3}
.nav-gs{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.75);border-radius:999px}
.nav-gs:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.nav-gs .kbd{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:rgba(255,255,255,.7)}
.nav-ej label{color:rgba(255,255,255,.6);text-transform:none;letter-spacing:-.025em;font-size:11px;font-weight:500}
.nav-ej select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:12px}
.nav-ej select option{color:var(--carbon);background:#fff}
.nav li.grp{color:rgba(255,255,255,.5);text-transform:none;letter-spacing:-.025em;font-size:11px;font-weight:500}
.nav li>button{color:rgba(255,255,255,.78);border-radius:12px;padding:10px 12px;font-weight:500}
.nav li>button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav li>button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--cian)}
.nav-foot{border-top:1px solid rgba(255,255,255,.1)}
.nav-tog{background:transparent;border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.65);border-radius:999px}
.nav-tog:hover{border-color:rgba(255,255,255,.32);color:#fff}
body.min .nav li.grp{border-top-color:rgba(255,255,255,.1)}
.mob .logo-mob{height:22px;width:auto;display:block}
.wrap{padding:26px 32px 80px}

/* ── encabezados ── */
.head{margin-bottom:22px}
.eyebrow{display:block;background:none;padding:0;margin:0 0 4px;border-radius:0;font-size:12px;font-weight:500;letter-spacing:-.025em;text-transform:none;color:var(--gris)}
h1{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.15;color:var(--carbon)}
.sub{font-size:13px;color:var(--gris);margin-top:6px;line-height:1.55}
.back{font-weight:500;color:var(--gris);padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--linea);margin-bottom:14px}
.back:hover{color:var(--celeste);border-color:var(--celeste)}
/* portada de una ficha: el fondo oficial */
.head.hero{background:var(--noche) var(--fondo) center/cover no-repeat;border-radius:20px;padding:26px 30px;color:#fff}
.head.hero h1{color:#fff;font-size:32px}
.head.hero .eyebrow{color:rgba(255,255,255,.78)}
.head.hero .sub{color:rgba(255,255,255,.82)}
.head.hero .btn.d{background:#fff;color:var(--rojo);border-color:#fff}
.head.hero .aviso{background:#fff;color:var(--carbon);border-radius:12px}

/* ── tarjetas ── */
.card{background:#fff;border:1px solid var(--linea);border-radius:var(--r);box-shadow:none}
.card-h{padding:16px 22px;background:#fff;border-bottom:1px solid var(--linea-2);border-radius:var(--r) var(--r) 0 0}
.card-h h2{font-size:15px;font-weight:700;letter-spacing:-.025em;color:var(--carbon)}
.card-h .n{color:var(--gris)}
.card-b{padding:20px 22px}
.card-b.flush{padding:0}
.bcard,.pcard,.tile,.dcard,.part,.idi-t,.idi-d{border-radius:14px;border:1px solid var(--linea);box-shadow:none;background:#fff}
.bcard:hover,.pcard:hover,.tile:hover,.idi-t:hover{border-color:var(--celeste);box-shadow:none;transform:none}

/* ── indicadores ── */
.met{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:17px 19px 15px;box-shadow:none}
.met:before{inset:0 0 auto 0;width:auto;height:4px;border-radius:var(--r) var(--r) 0 0;background:var(--celeste)}
.met-tot:before,.met-per:before{background:var(--celeste)}
.met-eje:before,.met-fue:before{background:var(--petroleo)}
.met-dis:before,.met.ok:before{background:var(--verde)}
.met-exc:before,.met.mal:before{background:var(--rojo)}
.met.warn:before{background:var(--naranja)}
.met .lbl{font-size:12px;font-weight:500;color:var(--gris);text-transform:none;letter-spacing:-.025em;min-height:0}
.met .val{font-size:24px;font-weight:700;letter-spacing:-.025em;margin:6px 0 3px;color:var(--carbon)}
.met .val.lg{font-size:20px}.met .val.xl{font-size:16px}
.met.cel .val,.met-tot.cel .val{color:var(--celeste)}
.met .ref{font-size:12px;color:var(--gris);opacity:1}
.met.link:hover{border-color:var(--celeste);box-shadow:none;transform:none}
.met.link .lbl{padding-right:16px}

/* ── solapas ── */
.tabs{display:inline-flex;gap:4px;background:var(--niebla);border-bottom:none;border-radius:999px;padding:5px;margin-bottom:22px;max-width:100%}
.tabs button{border-radius:999px;padding:9px 19px;border-bottom:none;font-size:13px;font-weight:500;color:var(--gris)}
.tabs button:hover{color:var(--carbon);background:rgba(255,255,255,.6)}
.tabs button.on{background:#fff;color:var(--celeste);font-weight:600;border-bottom:none;box-shadow:0 0 0 1px var(--linea)}
.seg{background:var(--niebla);border-radius:999px;padding:4px}.seg button{border-radius:999px}

/* ── botones (píldora) ── */
.btn{border-radius:999px;padding:8px 18px;background:var(--celeste);border:1.5px solid var(--celeste);color:#fff;box-shadow:none;font-weight:600;letter-spacing:-.025em}
.btn:hover{background:var(--petroleo);border-color:var(--petroleo);transform:none;box-shadow:none}
.btn.g{background:#fff;color:var(--celeste);border:1.5px solid var(--celeste)}
.btn.g:hover{background:var(--niebla);border-color:var(--celeste);color:var(--celeste)}
.btn.n{background:#fff;border:1.5px solid var(--linea);color:var(--carbon)}
.btn.n:hover{background:var(--niebla);border-color:var(--gris-claro);color:var(--carbon)}
.btn.d{background:#fff;border:1.5px solid var(--rojo);color:var(--rojo)}
.btn.d:hover{background:#fff1f1;border-color:var(--rojo);color:var(--rojo)}
.btn.s{padding:5px 13px}

/* ── campos ── */
.fi,.f input,.f select,.f textarea{background:#fff;border:1.5px solid var(--linea);border-radius:12px;color:var(--carbon);transition:border-color .15s,box-shadow .15s}
.fi{padding:8px 12px}
.fi:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--celeste);box-shadow:0 0 0 3px rgba(0,142,170,.15)}
.f input,.f select,.f textarea{padding:10px 12px}
.f label{font-size:12px;font-weight:600;color:var(--carbon);text-transform:none;letter-spacing:-.025em}
.f .hint{color:var(--gris)}
.filtros{border-radius:var(--r);border:1px solid var(--linea);background:#fff;padding:16px 20px;box-shadow:none}
.buscador{border-radius:999px}
.chip{font-weight:600;box-shadow:none;padding:3px 10px;letter-spacing:-.025em}
.c-dif{background:var(--niebla);color:var(--petroleo)}
.cb{border-radius:999px;padding:6px 14px;box-shadow:none;background:#fff;border:1px solid var(--linea)}
.cb.on{border-color:var(--celeste);box-shadow:none}

/* ── tablas ── */
th{background:var(--niebla);color:var(--celeste);font-size:12px;font-weight:700;text-transform:none;letter-spacing:-.025em;padding:12px 16px}
td{padding:13px 16px}
tbody tr.clic:hover{background:var(--niebla)}
tfoot td{background:var(--niebla)}
table{font-size:12.8px}
.aviso{border-radius:0 12px 12px 0;border-left-width:4px}

/* ── calendario ── */
.cgrid,.cweek{border-radius:var(--r);box-shadow:none}
.cd.hoy{background:var(--niebla);box-shadow:inset 0 0 0 2px var(--celeste)}
.cd{min-height:112px}
.ev{border-radius:7px;padding:4px 7px}
.ag,.hy{border-radius:var(--r);box-shadow:none;border:1px solid var(--linea);background:#fff;overflow:hidden}
.ag{margin-bottom:14px}
.ag-r:hover{background:var(--niebla)}
.ag-r.prox{background:var(--niebla);box-shadow:inset 3px 0 0 var(--celeste)}
.ag-d{border:1px solid var(--linea);background:#fff;border-radius:12px}
.ag-d b{color:var(--celeste)}
.hy-y{background:var(--niebla);color:var(--petroleo);border-radius:12px}
.pn{border:1px solid var(--linea)}.pn:hover{border-color:var(--celeste);background:var(--niebla)}

/* ── ventanas ── */
.ov{background:rgba(20,44,50,.62)}
.mdl{border-radius:20px;box-shadow:0 20px 60px rgba(20,44,50,.35)}
.mdl-h{background:var(--petroleo);padding:19px 26px}
.mdl-h h3{font-size:17.5px;font-weight:700;color:#fff}
.mdl-x{border-radius:50%;width:30px;height:30px;background:rgba(255,255,255,.18)}
.mdl-b{padding:22px 26px 28px}
.gs-panel{border-radius:20px;box-shadow:0 20px 60px rgba(20,44,50,.35)}
.gs{background:rgba(20,44,50,.55)}
.toast{background:var(--noche);color:#fff;border-radius:999px;padding:12px 24px;box-shadow:var(--sombra-h)}

/* ── secciones de las fichas ── */
.sec{background:#fff;border:1px solid var(--linea);border-radius:var(--r);box-shadow:none;margin-bottom:16px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--linea-2);background:#fff}
.sec-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--niebla)}
.sec-h h3{font-size:15px;font-weight:700;letter-spacing:-.025em;line-height:1.2;color:var(--carbon)}
.sec-h p{font-size:12px;color:var(--gris);margin-top:2px}
.sec-b{padding:22px 24px 24px}
.sec .estado-big{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--niebla);border:none;border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:13px}
.savebar{position:sticky;bottom:16px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--linea);border-radius:999px;padding:10px 12px 10px 24px;box-shadow:var(--sombra-h)}
.idi-top{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:16px 22px;box-shadow:none;margin-bottom:18px}
.idi-per{font-size:21px;font-weight:700;letter-spacing:-.025em}
.mets{gap:14px}.grid{gap:18px}
input[type=checkbox]{accent-color:var(--celeste)}
.gres{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media(max-width:1180px){.gres{grid-template-columns:1fr}}
@media(max-width:860px){.wrap{padding:16px 14px 70px}h1{font-size:24px}.head.hero{padding:20px}}

/* ═══ ingreso (fondo oficial + logo oficial) y estado del guardado ═══ */
.login{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:var(--noche) var(--fondo) center/cover no-repeat}
.login.on{display:flex}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:36px 32px 28px;text-align:center}
.login-logo{height:48px;width:auto;display:block;margin:0 auto 16px}
.login-card h2{font-size:22px;font-weight:700;letter-spacing:-.025em;color:var(--carbon)}
.login-sub{font-size:13px;color:var(--gris);margin:4px 0 22px}
.login-card form{text-align:left}
.login-card label{display:block;font-size:12px;font-weight:600;color:var(--carbon);margin:14px 0 6px;letter-spacing:-.025em}
.login-card input{width:100%;padding:12px 14px;border:1.5px solid var(--linea);border-radius:12px;font:inherit;font-size:14px;background:#fff;color:var(--carbon);letter-spacing:-.025em}
.login-card input:focus{outline:none;border-color:var(--celeste);box-shadow:0 0 0 3px rgba(0,142,170,.15)}
.login-btn{width:100%;justify-content:center;margin-top:20px;padding:12px;font-size:14px}
.login-link{display:block;margin:14px auto 0;background:none;border:none;color:var(--celeste);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline}
.login-msg{font-size:12.5px;margin-top:16px;color:var(--gris);min-height:18px;line-height:1.5}
.login-msg.err{color:var(--rojo)}
.login-spin{width:34px;height:34px;border:4px solid var(--niebla);border-top-color:var(--celeste);border-radius:50%;margin:10px auto 14px;animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.login-spin{animation:none}}
.sb-box{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:10px;border-radius:14px;background:rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.82)}
.sb-dot{width:9px;height:9px;border-radius:50%;background:var(--gris-claro);flex-shrink:0}
.sb-info{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.sb-user{font-size:10px;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-btn{background:rgba(255,255,255,.12);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px}
.sb-btn:hover{background:rgba(255,255,255,.24)}
body.min .sb-info,body.min .sb-btn:nth-of-type(2){display:none}

/* ── recordatorio de la nómina ── */
.nom-rec{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:2px solid var(--naranja);border-radius:var(--r);padding:14px 18px;margin-bottom:16px}
.nom-bell{font-size:26px;line-height:1}
.nom-rec-t{font-weight:800;letter-spacing:-.025em;font-size:15px;color:var(--carbon);margin-bottom:2px}
.nom-x{border:none;background:transparent;color:var(--gris);font-size:18px;cursor:pointer;width:32px;height:32px;border-radius:50%;line-height:1}
.nom-x:hover{background:var(--niebla);color:var(--carbon)}

/* ═══════════════ CELULAR (se ve bien y se instala como app) ═══════════════ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:rgba(0,142,170,.18);overscroll-behavior-y:none}
.mob{padding-top:calc(10px + env(safe-area-inset-top,0px))}
@media(max-width:860px){
 .nav{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media(max-width:720px){
 .wrap{padding:14px 12px calc(88px + env(safe-area-inset-bottom,0px))}
 h1{font-size:24px}.head.hero h1{font-size:23px}
 .headrow{flex-direction:column;align-items:stretch!important;gap:10px}
 .headrow>.btn,.headrow .acts{align-self:flex-start}
 .mets{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
 .met{padding:13px 13px 11px}.met .val{font-size:19px;margin:4px 0 2px}.met .val.lg{font-size:17px}.met .val.xl{font-size:14px}.met .lbl{font-size:11.5px}.met .ref{font-size:11px;line-height:1.35}
 .grid,.grid.g2,.grid.g3,.grid.g4,.gres,.form{grid-template-columns:minmax(0,1fr)!important}
 .grid>*,.gres>*,.form>*,.card{min-width:0;max-width:100%}
 .card-h{flex-wrap:wrap;gap:8px;padding:14px 16px}.card-b{padding:16px}.card-b.flush{padding:0}
 .scroll,.card-b.flush{overflow-x:auto;-webkit-overflow-scrolling:touch}
 table{font-size:12px}th,td{padding:10px 10px}
 .tabs{display:flex!important;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto;padding:9px 15px}
 .btn{min-height:42px}.btn.s{min-height:36px}.acts{gap:8px}.acts .btn{flex:1 1 auto;justify-content:center}
 input,select,textarea,.fi,.f input,.f select,.f textarea{font-size:16px!important;max-width:100%;min-width:0}
 .filtros{padding:12px}.filtros .fgrid,.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .mdl-h{padding:16px 18px}.mdl-b{padding:16px 16px calc(26px + env(safe-area-inset-bottom,0px))}
 .gs-panel{width:calc(100vw - 20px);max-width:100%;max-height:82dvh}
 .savebar{bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px;padding:10px 12px;flex-wrap:wrap;gap:8px}
 .toast{bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 24px);text-align:center;white-space:normal}
 .cgrid,.cweek{grid-template-columns:repeat(7,minmax(0,1fr))!important}
 .cd{min-height:58px;padding:3px}.cd .dnum{font-size:11px}.ev{font-size:9px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .dow{font-size:10px;padding:6px 2px}
 .pgrid{grid-template-columns:minmax(0,1fr)!important}
 .head.hero{padding:18px 16px;border-radius:18px}
 .login-card{padding:28px 20px 22px}
 .nom-rec{padding:12px 14px}.nom-rec .btn{flex:1 1 auto}
 .sec-h{padding:14px 16px}.sec-b{padding:16px}
 .filtros .f{flex-wrap:wrap!important;max-width:100%}
 .filtros .f .fi[style*="width"]{width:auto!important;flex:1 1 120px}
 [style*="grid-template-columns:repeat(auto-fit,minmax(420px"]{grid-template-columns:minmax(0,1fr)!important}
 [style*="grid-template-columns:repeat(auto-fit,minmax(300px"]{grid-template-columns:minmax(0,1fr)!important}
}
@media(max-width:720px){
 .filtros.fil-mob>select,.filtros.fil-mob>.fgrid{display:none}
 .filtros.fil-mob.abierto>select{display:block;width:100%}
 .filtros.fil-mob.abierto>.fgrid{display:grid}
 .filtros.fil-mob{display:flex;flex-direction:column;gap:10px;align-items:stretch}
 .fil-btn{align-self:flex-start}
}

/* ── Presupuesto · tarjetas por línea ── */
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.lcard{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:16px 18px}
.lbar{height:8px;border-radius:5px;background:var(--linea);overflow:hidden}.lbar>i{display:block;height:100%;border-radius:5px}

/* ═══ Reportes: elegir el reporte, pasos con color y secciones plegables ═══ */
.rpt-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.rpt-h{margin:0;font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--carbon)}
.rtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.rtile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:#fff;border:1.5px solid var(--linea);border-radius:18px;padding:18px 20px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s}
.rtile:hover{border-color:var(--celeste)}
.rtile.on{border-color:var(--celeste);box-shadow:0 0 0 3px rgba(0,142,170,.16)}
.rt-i{font-size:28px;line-height:1}.rt-t{font-weight:700;font-size:16px}.rt-d{font-size:12.5px;color:var(--gris);line-height:1.5}
.stp{background:#fff;border:1px solid var(--linea);border-radius:18px;overflow:hidden}
.stp-h{display:flex;align-items:center;gap:14px;padding:14px 20px;color:#fff}
.stp-n{width:30px;height:30px;border-radius:50%;background:#fff;color:#142C32;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.stp-t{font-weight:700;font-size:16px}.stp-s{font-size:12px;opacity:.88;margin-top:1px}
.stp-b{padding:18px 20px}
.acc{border:1px solid var(--linea);border-radius:14px;background:#fff;margin-bottom:10px}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 18px;font-weight:700}
.acc>summary::-webkit-details-marker{display:none}
.acc[open]{border-color:var(--celeste)}
.acc .chev{margin-left:auto;font-size:18px;color:var(--gris);transition:transform .2s}
.acc[open]>summary .chev{transform:rotate(180deg)}
.acc-n{font-size:11.5px;font-weight:600;color:var(--gris);background:var(--niebla);border-radius:999px;padding:2px 10px}
.acc[open]>summary .acc-n{background:#E3F3F6;color:var(--celeste)}
.acc-b{padding:4px 18px 18px}
@media(max-width:720px){.stp-b{padding:14px}.stp-h{padding:12px 14px}.rpt-h{font-size:21px}}

/* ── acciones de una capacitación: íconos de línea y opciones claras ── */
.ib{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--linea);background:#fff;color:var(--carbon);cursor:pointer;vertical-align:middle}
.ib:hover{border-color:var(--celeste);color:var(--celeste);background:var(--niebla)}
.btn svg{vertical-align:-3px;margin-right:6px}
.acc-grid{display:grid;gap:10px}
.acc-op{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--linea);border-radius:16px;padding:14px 16px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s}
.acc-op:hover{border-color:var(--celeste)}
.acc-op b{font-size:14.5px}.acc-op small{display:block;font-size:12px;color:var(--gris);margin-top:2px;line-height:1.45;font-weight:400}
.acc-ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-peligro{margin-top:18px;border:1.5px dashed var(--rojo);border-radius:16px;padding:14px 16px;background:#FFF9F9}
.head.hero .btn.g svg{margin-right:6px}

/* Facturación · comprobantes: que entre en el ancho sin correr hacia el costado */
table.fit{width:100%;font-size:12.5px}
table.fit th,table.fit td{padding:10px 8px}
table.fit .fi{padding:6px 8px;font-size:12.5px;max-width:100%}
table.fit td .nom{font-size:13px;line-height:1.35}

/* celular: la ventana ocupa la pantalla y scrollea entera (como una hoja); el fondo queda quieto */
body.modal-open{position:fixed;left:0;right:0;width:100%;overflow:hidden}
@media(max-width:720px){
 .ov{align-items:flex-start!important;padding:0!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
 .mdl{display:block!important;width:100%!important;max-width:100%!important;max-height:none!important;overflow:visible!important;border-radius:22px 22px 0 0!important;margin:auto 0 0 0!important;min-height:0}
 .mdl>.mdl-h{position:sticky;top:0;z-index:3;border-radius:22px 22px 0 0;padding-top:calc(15px + env(safe-area-inset-top,0px))}
 .mdl-b{padding-bottom:calc(26px + env(safe-area-inset-bottom,0px))}
 .mdl-b .acts{position:sticky;bottom:0;background:#fff;padding:12px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:14px;border-top:1px solid var(--linea-2);z-index:2}
}
@media(min-width:721px){body.modal-open{position:static;overflow:hidden}}
</style>

<script>
let DB={},EJ='25.26',RUTA='res',ARG=null;
const KEY='fyo_plan_v17';
async function unz(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
 const d=new DecompressionStream('gzip'),w=d.writable.getWriter();w.write(u);w.close();
 return JSON.parse(new TextDecoder().decode(await new Response(d.readable).arrayBuffer()));}

/* ── helpers ── */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js=s=>esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
/* ids únicos: el contador evita repetidos aunque se creen varios en el mismo milisegundo */
let _uidN=0;
const uid=p=>p+Date.now().toString(36).slice(-5)+(++_uidN).toString(36).padStart(2,'0')+Math.random().toString(36).slice(2,3);
const plata=n=>(n<0?'−$':'$')+Math.round(Math.abs(n||0)).toLocaleString('es-AR');
const platak=n=>{const s=n<0?'−':'';n=Math.abs(n||0);
 return s+(n>=1e6?'$'+(n/1e6).toFixed(1).replace('.',',')+' M':n>=1e3?'$'+Math.round(n/1e3)+' k':'$'+Math.round(n))};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW=['lun','mar','mié','jue','vie','sáb','dom'];
/* la app usa la fecha real de hoy, salvo que en Configuración se fije una a mano */
function hoyReal(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
let HOY=hoyReal();
function fecha(s){if(!s)return '—';const p=String(s).slice(0,10).split('-');
 return p.length<3?esc(s):(+p[2])+' '+MESC[+p[1]-1]+' '+p[0].slice(2)}
const mesTxt=m=>m?MESL[+m.slice(5,7)-1]+' '+m.slice(0,4):'—';
function iniciales(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()}
function avc(n){const k=['','v','o','p','a'];let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%997;return k[h%5]}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
/* guardar(): se define más abajo (capa de Supabase) */
function limpiarVersionesViejas(){}

/* ── constantes ── */
const ESTADOS=['Pendiente','Inscripto','En curso','Finalizada','Cancelada','Diferida'];
const TIPOS=['Programa','Curso','Coaching','Assessment','Jornada'];
const SUBS=['Coaching','Assessment','Potencial'];
const FOCOS=['Técnico','Soft','IA'];
const FCOL={'Técnico':'c-gris','Soft':'c-dif','IA':'c-cur'};
const fchip=f=>`<span class="chip ${FCOL[f]||'c-gris'}">${esc(f||'Sin foco')}</span>`;
const VERTS=['Comercial','Back Office','Áreas corporativas','IT','Amauta'];
const VCOL={'Comercial':'var(--celeste)','Back Office':'var(--azul)','Áreas corporativas':'var(--violeta)',
 'IT':'var(--cian)','Amauta':'var(--verde)'};
const CEST={'Pendiente':'c-pen','En curso':'c-cur','Finalizada':'c-fin','Cancelada':'c-can','Diferida':'c-dif',
 'Baja':'c-baja','Inscripto':'c-cur','Asistió':'c-fin','No asistió':'c-baja','Activa':'c-fin',
 'Recibida':'c-rec','Cargada':'c-carg','Pagada':'c-pag'};
const chip=(t,c)=>`<span class="chip ${c||CEST[t]||'c-gris'}">${esc(t)}</span>`;
const SOCS=['Futuros y Opciones.com SA','FYO ACOPIO SA','AMAUTA AGRO SA','Agrofy SAU','BIOND','FYO Foods S.A.U.','fyoTech'];
const SOCAB={'Futuros y Opciones.com SA':'fyo','FYO ACOPIO SA':'FASA','AMAUTA AGRO SA':'Amauta',
 'Agrofy SAU':'Agrofy','BIOND':'BIOND','FYO Foods S.A.U.':'Foods','fyo Foods':'Foods','fyoTech':'fyoTech'};
const ab=s=>SOCAB[s]||s||'—';
const ESTFACT=['Pendiente','Recibida','Cargada','Pagada'];
const MOTIVOS=['Vacaciones/Licencia','Cambio de prioridades del área','No podía asistir'];
const SEN=['Junior','Semi Sr','Sr','Especialista','Líder','Gerente','Director'];

/* ── consultas ── */
const plan=()=>DB.plan.filter(p=>p.ej===EJ);
const vivas=()=>plan().filter(p=>p.est!=='Cancelada');
const partidas=()=>DB.part.filter(p=>p.ej===EJ);
const ejercicios=()=>[...new Set(DB.part.map(p=>p.ej).concat(DB.plan.map(p=>p.ej)))].sort();
const acto=id=>DB.plan.find(p=>p.id===id);
const activos=p=>(p.parts||[]).filter(x=>x.est!=='Baja');
const sigEj=e=>{const[a,b]=e.split('.').map(Number);return String(a+1).padStart(2,'0')+'.'+String(b+1).padStart(2,'0')};
const antEj=e=>{const[a,b]=e.split('.').map(Number);return String(a-1).padStart(2,'0')+'.'+String(b-1).padStart(2,'0')};
const ejDeMes=ym=>{const y=+ym.slice(0,4),m=+ym.slice(5,7),a=m>=10?y:y-1;
 return String(a).slice(2)+'.'+String(a+1).slice(2)};
let NOMIX={};
let NOMK={};
function reindex(){NOMIX={};NOMK={};DB.nom.forEach(p=>{NOMIX[p.nombre.toLowerCase()]=p;if(p.legajo)NOMIX['#'+p.legajo]=p;try{const k=nomKey(p.nombre);if(k)NOMK[k]=p}catch(e){}})}
const buscarPersona=q=>{if(!q)return null;const t=String(q).trim();let r=NOMIX['#'+t]||NOMIX[t.toLowerCase()]||null;
 if(!r){try{const k=nomKey(t);if(k)r=NOMK[k]||null}catch(e){}}return r};
const nomDe=n=>DB.nom.find(p=>p.nombre===n);
const eq=id=>DB.eq.find(e=>e.id===id);
const eqDe=l=>DB.eq.find(e=>e.lider===l);
const relDe=id=>DB.rel.filter(r=>r.eqId===id).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
/* actividades del ejercicio vigente que tocan a un grupo */
function actsDe(gente,ej){const S=new Set(gente);
 return DB.plan.filter(p=>(!ej||p.ej===ej)&&p.est!=='Cancelada'&&p.parts.some(x=>S.has(x.nom)&&x.est!=='Baja'))}
function invDe(gente,ej){const S=new Set(gente);let t=0;
 DB.plan.filter(p=>(!ej||p.ej===ej)&&p.est!=='Cancelada').forEach(p=>{const a=activos(p);
  if(a.length)t+=a.filter(x=>S.has(x.nom)).length*((p.real||0)/a.length)});
 return Math.round(t)}
function alcanzados(gente,ej){const S=new Set(gente),o=new Set();
 actsDe(gente,ej).forEach(p=>activos(p).filter(x=>S.has(x.nom)).forEach(x=>o.add(x.nom)));
 DB.beca.filter(b=>S.has(b.nom)&&b.est!=='Cancelada').forEach(b=>o.add(b.nom));
 DB.idi.filter(i=>S.has(i.nom)&&i.est==='Activa').forEach(i=>o.add(i.nom));
 return o}

/* ── imputación ── */
function ctaFor(soc,foco,tipo){
 const C=partidas().filter(c=>c.soc===soc);
 if(!C.length)return null;
 const f=rx=>C.find(c=>rx.test(c.desc)||rx.test(c.area));
 if(tipo==='Beca'||tipo==='Idioma')return C.find(c=>/^Capacitaciones$/i.test(c.desc.trim()))||f(/Gastos/)||C[0];
 return f(/^Capacitaciones$/i)||f(/Gastos/)||C[0];
}
/* cuenta predeterminada de una persona: según su sociedad y su vertical; IT va a fyoTech cuando existe */
function ctaDefault(soc,vn){
 const tech=partidas().find(c=>c.soc==='fyoTech');
 if(tech&&(vn==='IT'||soc==='Agrofy SAU'))return tech;
 return ctaVert(soc,vn)||ctaVert('Futuros y Opciones.com SA',vn)||ctaGen('Futuros y Opciones.com SA')||null;
}
function ctaGen(soc){const C=partidas().filter(c=>c.soc===soc);
 const L=C.length?C:partidas().filter(c=>c.soc==='Futuros y Opciones.com SA');
 return L.find(c=>/^Capacitaciones$/i.test((c.desc||'').trim()))||L.find(c=>/Gastos/i.test(c.desc))||L[0]}
function ctaVert(soc,vn){
 const C=partidas().filter(c=>c.soc===soc); if(!C.length)return null;
 const f=rx=>C.find(c=>rx.test(c.desc));
 if(vn==='IT')return f(/IT/)||f(/^Capacitaciones$/i)||C[0];
 if(vn==='Comercial')return f(/Comercial/)||f(/^Capacitaciones$/i)||C[0];
 if(vn==='Back Office')return f(/BO|Back/i)||f(/^Capacitaciones$/i)||C[0];
 if(vn==='Áreas corporativas')return f(/Adm/i)||f(/^Capacitaciones$/i)||C[0];
 return f(/^Capacitaciones$/i)||f(/Gastos/)||C[0];
}
/* personas → filas por sociedad y cuenta (cada persona va a la cuenta de su sociedad y equipo) */
function imputarGrupos(p,monto){
 const act=activos(p),M=monto===undefined?(p.real||p.ppto||0):monto;
 if(!act.length)return[];
 const tot=act.length,by={};
 act.forEach(x=>{const soc=x.soc||'Futuros y Opciones.com SA',vn=x.vn||'Áreas corporativas',c0=ctaDefault(soc,vn),k=soc+'|'+(c0?c0.id:'?'+vn);
  const ov=(p.ctaGr||{})[k],c=ov?(partidas().find(z=>z.id===ov.cid)||c0):c0;
  const g=by[k]=by[k]||{soc,c,k,ov:ov&&c!==c0?ov:null,n:0,vns:{}};g.n++;g.vns[vn]=(g.vns[vn]||0)+1});
 const rows={};
 Object.values(by).forEach(g=>{const id=g.soc+'|'+(g.c?g.c.id:g.k),r=rows[id]=rows[id]||{keys:[],cid:g.c?g.c.id:'',soc:g.soc,n:0,vns:new Set(),
   cta:g.c?g.c.cta:'',desc:g.c?g.c.desc:'Cuenta a definir',csoc:g.c?g.c.soc:'',ov:false,motivo:''};
  r.keys.push(g.k);r.n+=g.n;Object.keys(g.vns).forEach(v=>r.vns.add(v));if(g.ov){r.ov=true;r.motivo=g.ov.motivo}});
 return Object.values(rows).map(r=>({keys:r.keys,key:r.keys[0],cid:r.cid,soc:r.soc,n:r.n,tot,monto:Math.round(M*r.n/tot),vn:[...r.vns].join(' · '),
  cta:r.cta,desc:r.desc,csoc:r.csoc,ov:r.ov,motivo:r.motivo})).sort((a,b)=>b.monto-a.monto);
}

  (p.gastos||[]).forEach(g=>{const c=DB.part.find(x=>x.ej===EJ&&x.id===g.cid);if(!c||!S[c.id])return;
   S[c.id][(g.nro||g.fpago)?'eje':'com']+=(+g.monto||0);
   S[c.id].items.push({t:'gasto',id:p.id,nom:p.nom+' · '+g.concepto,m:+g.monto||0,cerrado:!!(g.nro||g.fpago),di})});
 });

  if(becaConCrono(b)){const r=becaResumen(b);
   if(r.pagadoEJ){S[c.id].eje+=r.pagadoEJ;S[c.id].items.push({t:'beca',id:b.id,nom:'Beca · '+b.nom+' · pagado',m:r.pagadoEJ,cerrado:true})}

  S[f.cid][(f.nro||f.fpago)?'eje':'com']+=(+f.monto||0);
  S[f.cid].items.push({t:'fact',id:f.id,nom:f.act,m:+f.monto||0,cerrado:!!(f.nro||f.fpago)})});
 Object.values(S).forEach(s=>{s.usado=s.eje+s.com;s.saldo=s.asignado-s.usado;s.pctU=pct(s.usado,s.asignado)});
 return S;
}

/* métrica estándar */
function met(lbl,val,ref,cls,ruta){
 const s=String(val).replace(/<[^>]*>/g,'').length;
 return `<div class="met ${cls||''}${ruta?' link':''}" ${ruta?`onclick="ir('${ruta}')" tabindex="0" onkeypress="if(event.key==='Enter')ir('${ruta}')"`:''}>
  <div class="lbl">${lbl}</div><div class="val num ${s>13?'xl':s>10?'lg':''}">${val}</div><div class="ref">${ref}</div></div>`}
/* variante de met() con un onclick JS libre en vez de ir(ruta) — para abrir modales de desglose */
function metOn(lbl,val,ref,cls,onclickJs){
 const s=String(val).replace(/<[^>]*>/g,'').length;
 return `<div class="met ${cls||''}${onclickJs?' link':''}" ${onclickJs?`onclick="${onclickJs}" tabindex="0" onkeypress="if(event.key==='Enter'){${onclickJs}}"`:''}>
  <div class="lbl">${lbl}</div><div class="val num ${s>13?'xl':s>10?'lg':''}">${val}</div><div class="ref">${ref}</div></div>`}
/* torta / donut */
function donut(data,size,label){
 size=size||150;const r=size/2-6,ir=r*0.6,cx=size/2,cy=size/2;
 const tot=data.reduce((a,d)=>a+d.v,0);
 if(!tot)return `<svg width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--linea-2)" stroke-width="${r-ir}"/></svg>`;
 let a0=-Math.PI/2,paths='';
 data.filter(d=>d.v>0).forEach(d=>{
  const ang=d.v/tot*2*Math.PI,a1=a0+ang,big=ang>Math.PI?1:0;
  const p=(rad,a)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
  const[x1,y1]=p(r,a0),[x2,y2]=p(r,a1),[x3,y3]=p(ir,a1),[x4,y4]=p(ir,a0);
  if(ang>=2*Math.PI-0.001){
   paths+=`<circle cx="${cx}" cy="${cy}" r="${(r+ir)/2}" fill="none" stroke="${d.c}" stroke-width="${r-ir}"/>`;
  }else{
   paths+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${ir} ${ir} 0 ${big} 0 ${x4} ${y4} Z" fill="${d.c}"><title>${esc(d.t)}: ${d.v}</title></path>`;}
  a0=a1});
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}
  <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="${size/6}" font-weight="600" fill="var(--tinta)">${tot}</text>
  <text x="${cx}" y="${cy+size/9}" text-anchor="middle" font-size="${size/13}" fill="var(--gris)">${label||'actividades'}</text></svg>`;
}
/* anillo de progreso para dashboards */
function ring(p,color,size){
 size=size||62;const r=(size-8)/2,c=2*Math.PI*r,o=c*(1-Math.min(1,Math.max(0,p/100)));
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--linea-2)" stroke-width="7"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
   stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 ${size/2} ${size/2})"/>
  <text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="${size/4.2}" font-weight="600" fill="var(--tinta)">${p}%</text></svg>`}

/* ── campos de plata: separadores de miles y $ mientras se escribe ── */
const fmtMoney=v=>{let t=String(v==null?'':v);if(/^-?\d+\.\d+$/.test(t))t=String(Math.round(parseFloat(t)));
 const d=t.replace(/\D/g,'');return d?'$ '+d.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''};
(function(){
 const D=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
 const hook=el=>{if(el._m)return;el._m=1;
  Object.defineProperty(el,'value',{configurable:true,get(){return String(D.get.call(el)).replace(/\D/g,'')},set(v){D.set.call(el,fmtMoney(v))}});
  D.set.call(el,fmtMoney(D.get.call(el)))};
 const scan=r=>{if(r&&r.querySelectorAll)r.querySelectorAll('input.money').forEach(hook)};
 new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.matches&&n.matches('input.money'))hook(n);scan(n)}}))).observe(document.body,{childList:true,subtree:true});
 document.addEventListener('input',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('money')){hook(t);
  D.set.call(t,fmtMoney(D.get.call(t)));const L=D.get.call(t).length;try{t.setSelectionRange(L,L)}catch(x){}}},true);
 /* mientras se tipea el año a mano ("0002") no se guarda: espera a que quede 2000-2100 */
 document.addEventListener('change',e=>{const t=e.target;
  if(t&&t.type==='date'&&t.value){const y=+t.value.slice(0,4);if(y<2000||y>2100){e.stopImmediatePropagation();e.stopPropagation()}}},true);
 scan(document);
})();
window.addEventListener('error',e=>{const m=String(e.message||'');if(/ResizeObserver|Script error/i.test(m))return;try{toast('⚠️ Error: '+m)}catch(x){}});

function gsRender(q){

 const R=[];
 DB.plan.filter(p=>p.nom.toLowerCase().includes(q)).slice(0,8).forEach(p=>
  R.push(['Capacitación',p.nom,`${p.ej} · ${p.prov} · ${activos(p).length} personas`,`ir('act','${p.id}')`]));
 DB.prov.filter(p=>p.nom.toLowerCase().includes(q)).slice(0,6).forEach(p=>

 DB.beca.filter(b=>b.nom.toLowerCase().includes(q)||b.inst.toLowerCase().includes(q)).slice(0,5).forEach(b=>
  R.push(['Beca',b.nom,`${b.inst||'sin institución'} · ${plata(b.ejec)}`,`cerrarGS();ir('bi');editBeca('${b.id}')`]));
 DB.idi.filter(i=>i.nom.toLowerCase().includes(q)||i.profe.toLowerCase().includes(q)).slice(0,5).forEach(i=>

 DB.eq.filter(e=>e.lider.toLowerCase().includes(q)).slice(0,5).forEach(e=>

 out.innerHTML=R.length?R.map(([t,n,s,a])=>`<div class="gs-it" onclick="cerrarGS();${a}">

  :'<div class="gs-hint">Sin resultados para «'+esc(q)+'».</div>';
}

  ${met('Gastos asociados',gast?plata(gast):'—',(p.gastos||[]).length?`${p.gastos.length} ítems (viáticos, comida, sala)`:'sin gastos cargados','met-fue')}
  ${met('Costo total',total?plata(total):'—','curso más gastos asociados','met-tot')}
  ${met('Participantes',act.length,bajas?`${bajas} de baja`:'sin bajas','met-per')}

/* qué estado le toca según las fechas y cuánto falta; se recalcula apenas se completa una fecha */
function cuandoInfo(ini,fin,fli,abierto){
 const d=x=>Math.round((s2d(x)-s2d(HOY))/86400000),pl=n=>n===1?'':'s',fin2=fin||(abierto?'':ini);
 if(abierto&&!fin&&ini)return ini<=HOY?{est:'En curso',txt:'<b>En curso</b> ahora · todavía sin fecha de finalización',rng:fecha(ini)+' → sin fin'}:{est:fli?'Inscripto':'Pendiente',txt:`Empieza en <b>${d(ini)} día${pl(d(ini))}</b>`,rng:fecha(ini)};
 if(!ini)return{est:fli?'Inscripto':'Pendiente',txt:fli?'Invitación enviada · todavía sin fecha de inicio cargada':'Todavía no tiene fecha de inicio cargada',rng:''};
 const rng=fecha(ini)+(fin2&&fin2!==ini?' → '+fecha(fin2):'');
 if(fin2<HOY)return{est:'Finalizada',txt:`Terminó hace <b>${-d(fin2)} día${pl(-d(fin2))}</b>`,rng};
 if(ini<=HOY)return{est:'En curso',txt:'<b>En curso</b> ahora'+(fin2>HOY?` · faltan <b>${d(fin2)} día${pl(d(fin2))}</b> para que termine`:''),rng};
 return{est:fli?'Inscripto':'Pendiente',txt:`Empieza en <b>${d(ini)} día${pl(d(ini))}</b>`,rng}}

 const g=k=>(document.getElementById(k)||{}).value||'',ab_=(document.getElementById('e_fin')||{dataset:{}}).dataset.abierto==='1',ci=cuandoInfo(g('e_ini'),ab_?g('e_fin'):(g('e_fin')||g('e_ini')),g('e_fli'),ab_);

   <div class="f"><label>Fecha de inicio</label><input type="date" id="e_ini" value="${f.ini}" oninput="fiCuando()" onchange="fiCuando()" ${p.enc.length?'readonly title="Sale del primer encuentro"':''}></div>
   <div class="f"><label>Fecha de fin</label><input type="date" id="e_fin" data-abierto="${esAbierto(p)?1:0}" value="${esAbierto(p)?(p.fin||''):(p.enc.length?f.fin:(p.fin||''))}" oninput="fiCuando()" onchange="fiCuando()" ${p.enc.length&&!esAbierto(p)?'readonly title="Sale del último encuentro"':''}>
    <div class="hint">${esAbierto(p)?'Dejala vacía mientras siga en curso: cuando la completes, pasa a Finalizada.':p.enc.length?'Salen de las fechas de los encuentros.':'Si no la ponés, termina el mismo día que empieza.'}</div></div>
   <div class="f full" id="mot_box" style="display:${p.est==='Cancelada'||p.est==='Diferida'?'block':'none'}"><label>Motivo de cancelación o postergación</label><textarea id="e_mot" placeholder="Obligatorio si el estado es Cancelada o Diferida">${esc(p.motivo||'')}</textarea></div>

   <div class="f"><label>¿Sale del presupuesto?</label><select id="e_pre" onchange="document.getElementById('di_box').style.display=this.value==='Fuera'?'contents':'none'">

    <div class="f"><label>Aprobado por</label><input id="e_aprob" value="${esc(p.aprob||'')}" placeholder="Quién aprobó la decisión de inversión"></div>
    <div class="f"><label>Fecha de aprobación</label><input type="date" id="e_faprob" value="${p.faprob||''}"></div></div>
   <div class="f"><label>Quién la cargó</label><select id="e_carg"><option value="">Sin asignar</option>${['Valeria','Matías'].concat(p.carg&&!['Valeria','Matías'].includes(p.carg)?[p.carg]:[]).map(n=>`<option ${p.carg===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
  </div></div></div>

 <div class="sec d"><div class="sec-h"><div class="sec-ic">📝</div><div><h3>Seguimiento</h3><p>Notas y pendientes de esta capacitación</p></div></div><div class="sec-b"><div class="form">
   <div class="f full"><label>Link de la encuesta de satisfacción</label><input id="e_enc" type="url" placeholder="https://…" value="${esc(p.encuesta||'')}"><div class="hint">Es la que se manda cuando termina. Queda como botón “Encuesta” arriba, en el Plan y en la solapa Participantes.</div></div>
   <div class="f full"><label>Otros links <span class="sub2" style="font-weight:400">· opcional</span></label><div id="e_links">${(p.links||[]).map(l=>linkRow(l.url,l.ref)).join('')}</div><button type="button" class="btn n s" onclick="linkAdd('e_links')">+ Agregar link</button><div class="hint">Para material, documentos o lo que haga falta. Al lado de cada link dejá una referencia de qué es.</div></div>
   <div class="f full"><label>Notas</label><textarea id="e_notas" style="min-height:84px">${esc(p.notas||'')}</textarea></div>
   <div class="f full"><label>Pendiente / acción</label><input id="e_accion" value="${esc(p.accion||'')}" placeholder="Qué falta hacer o a quién hay que esperar"></div>
  </div></div></div>

 <div class="savebar"><span class="sub2">Los cambios se guardan cuando apretás <b>Guardar</b>.</span>
  <div style="display:flex;gap:8px"><button class="btn n" onclick="volverFicha('${p.id}',0)">Descartar</button><button class="btn" onclick="guardarAct('${p.id}')">Guardar cambios</button></div></div>
 <datalist id="dlProvF">${DB.prov.map(x=>`<option value="${esc(x.nom)}">`).join('')}</datalist>`;
}
function guardarAct(id){
 const p=acto(id),g=i=>{const e=document.getElementById(i);return e?e.value:''};
 if(!window._provYaF){const inp=document.getElementById('e_prov');if(inp&&inp.value.trim()!==p.prov){if(provAsk('e_prov',()=>{window._provYaF=true;try{guardarAct(id)}finally{window._provYaF=false}},p.prov))return}}
 const antesReal=p.real;
 const est=g('e_est'),mot=g('e_mot').trim();
 if((est==='Cancelada'||est==='Diferida')&&!mot){toast('Poné el motivo: es obligatorio para cancelar o diferir');
  document.getElementById('e_mot').focus();return}
 if(g('e_pre')==='Fuera'&&!g('e_aprob').trim()){toast('Es una decisión de inversión: poné quién la aprobó');document.getElementById('e_aprob').focus();return}
 Object.assign(p,{nom:g('e_nom'),prov:g('e_prov'),tipo:g('e_tipo'),foco:g('e_foco'),dict:g('e_dict'),est,
  alc:g('e_alc'),fli:g('e_fli'),
  hs:g('e_hs'),presup:g('e_pre'),aprob:g('e_pre')==='Fuera'?g('e_aprob'):'',faprob:g('e_pre')==='Fuera'?(g('e_faprob')||HOY):'',carg:g('e_carg'),motivo:mot,notas:g('e_notas'),
  accion:g('e_accion')});
 {const mv=+g('e_real')||0;if(mv!==(antesReal||p.ppto||0)){p.real=mv;p.ppto=mv}}
 if(p.real>0&&!p.alta&&p.real!==antesReal)p.alta=HOY;
 if(!p.enc.length&&document.getElementById('e_ini'))Object.assign(p,{ini:g('e_ini'),fin:g('e_fin')});
 if(document.getElementById('e_sub'))p.sub=g('e_sub');
 if(document.getElementById('e_lin'))p.linea=g('e_lin');
 if(document.getElementById('e_enc')){const u=urlOk(g('e_enc'));if(u)p.encuesta=u;else delete p.encuesta}
 if(document.getElementById('e_links')){const L=linksLeer('e_links');if(L.length)p.links=L;else delete p.links}
 if(document.getElementById('e_coach')){const v=g('e_coach').trim();if(v)p.coach=v;else delete p.coach}
 syncEstadosAct();
 if(p.prov&&!DB.prov.some(x=>x.nom===p.prov))
  DB.prov.push({id:uid('P'),nom:p.prov,tipos:[p.tipo],mail:'',tel:'',cuit:'',contacto:'',notas:''});
 guardar();volverFicha(id,0);toast('Cambios guardados');
}
/* fechas de una capacitación: externas = inicio y fin; internas = primer y último encuentro */
function mesesAct(p){const s=new Set();(p.enc||[]).forEach(e=>{if(e.fecha)s.add(e.fecha.slice(0,7))});
 const{ini,fin}=actFechas(p);if(ini){let m=ini.slice(0,7);const f=(fin||ini).slice(0,7);let g=0;while(m<=f&&g<60){s.add(m);m=addMes(m,1);g++}}
 return s}
const mesOk=(p,m)=>!m||(m==='sin'?mesesAct(p).size===0:mesesAct(p).has(m));
/* coaching, potencial y assessment: siguen en curso hasta que se cargue la fecha de finalización */
const esAbierto=p=>p.tipo==='Coaching'||p.tipo==='Assessment'||p.sub==='Potencial'||p.sub==='Coaching'||p.sub==='Assessment';
function actFechas(p){
 /* inicio = primer encuentro (o la fecha de inicio); fin = último encuentro (o la fecha de fin). Sin fin, termina el mismo día (menos en coaching/potencial/assessment: ahí queda abierto). */
 const encs=(p.enc||[]).map(e=>e.fecha).filter(Boolean).sort();
 const ini=[encs[0],p.ini].filter(Boolean).sort()[0]||p.freal||'';
 const fin=(esAbierto(p)&&!p.fin)?'':([encs[encs.length-1],p.fin].filter(Boolean).sort().pop()||ini);
 return{ini,fin}
}
/* Inscripto: se completó la inscripción · En curso: desde la fecha de inicio · Finalizada: al llegar la fecha de fin o el último encuentro */
function estadoAuto(p){
 if(p.estFijo||p.est==='Cancelada'||p.est==='Diferida')return p.est;
 const{ini,fin}=actFechas(p);
 if(!ini&&!fin&&!p.fli)return p.est;
 if(fin&&fin<HOY)return'Finalizada';
 if(ini&&ini<=HOY)return'En curso';
 if(p.fli)return'Inscripto';
 return p.est==='Finalizada'||p.est==='En curso'?'Pendiente':p.est;
}
function syncEstadosAct(){let c=false;
 DB.plan.forEach(p=>{const e=estadoAuto(p);if(e!==p.est){p.est=e;c=true}});
 if(c)guardar()}
function cambiarEst(id,v){
 const p=acto(id);
 if(v==='auto'){trazar(p,'Reactivada','Estado automático',{a:'Automático'});p.est='Pendiente';p.motivo='';syncEstadosAct();guardar();refresh();toast('Vuelve al estado automático');return}
 if((v==='Cancelada'||v==='Diferida')&&!p.motivo){
  modal(cab('Motivo obligatorio',esc(p.nom))+`<div class="mdl-b">
   <div class="f full"><label>¿Por qué queda ${v.toLowerCase()}?</label>
    <textarea id="cm_mot" placeholder="Ej: el proveedor reprogramó / cambio de prioridades del área"></textarea></div>
   <div class="acts"><button class="btn" onclick="setEstMot('${id}','${v}')">Guardar</button>
    <button class="btn n" onclick="cerrar();refresh()">Cancelar</button></div></div>`,'sm');return}
 p.est=v;guardar();refresh();toast(esc(p.nom)+' → '+v)}
function setEstMot(id,v){
 const m=document.getElementById('cm_mot').value.trim();
 if(!m){toast('Poné el motivo');return}
 const p=acto(id);trazar(p,v==='Cancelada'?'Cancelada':'Diferida',m,{a:v});p.est=v;p.motivo=m;guardar();cerrar();refresh();toast('Actualizada · quedó registrado el motivo')}
function togProx(id){const p=acto(id);p.prox=!p.prox;guardar();refresh();
 toast(p.prox?'Marcada para el '+sigEj(EJ):'Ya no está marcada')}
function masivo(que){
 const P=plan(),eqF=F.lider?eqDe(F.lider):null,setF=eqF?new Set(eqF.gente):null;
 const L=P.filter(p=>(!F.est||estFiltro(p,F.est))&&mesOk(p,F.mes)&&(!F.tipo||p.tipo===F.tipo)&&(!F.dict||p.dict===F.dict)
  &&(!F.foco||p.foco===F.foco)&&(!F.prov||p.prov===F.prov)&&(!F.presup||p.presup===F.presup)
  &&(!F.vn||p.parts.some(x=>x.est!=='Baja'&&x.vn===F.vn))
  &&(!setF||p.parts.some(x=>x.est!=='Baja'&&setF.has(x.nom)))
  &&(!F.un||p.parts.some(x=>x.est!=='Baja'&&x.un===F.un))
  &&(!F.linea||(F.linea==='Sin línea'?!p.linea:p.linea===F.linea))&&(!F.carg||(F.carg==='Sin asignar'?!p.carg:p.carg===F.carg))&&(!F.arr||p.arrastra)&&(!F.rep||p.parts.some(x=>x.repetir&&x.est!=='Baja'))&&(!F.sinFli||(!p.fli&&!['Finalizada','Cancelada','Diferida'].includes(p.est)))&&(!F.sinImp||!p.real)&&(!F.sinFecha||!actFechas(p).ini)&&(!F.sinPart||!activos(p).length)&&(!F.prox||p.prox)
  &&(!F.q||(p.nom+' '+p.prov).toLowerCase().includes(F.q.toLowerCase())));
 if(!L.length){toast('No hay filas listadas');return}
 const txt={prox:`marcar las <b>${L.length}</b> actividades listadas para el ${sigEj(EJ)}`,
  cancel:`cancelar las <b>${L.length}</b> actividades listadas`,

/* ═════ Próxima edición: se crea la misma capacitación y se eligen quiénes pasan (bajas, los que no vinieron, los que faltaron a la mitad) ═════ */
function candidatosEdicion(p){
 const vistos=new Set(),out=[],add=(x,motivo,grupo)=>{const k=x.lg||x.nom;if(vistos.has(k))return;vistos.add(k);out.push({x,motivo,grupo,k})};
 p.parts.filter(x=>x.est==='Baja').forEach(x=>add(x,'Baja'+(x.motivo?' · '+x.motivo:''),'bajas'));
 if(tieneAsis(p)){const A=activos(p).map(x=>({x,a:asisPers(p,x)})).filter(o=>o.a.tot>0);
  A.filter(o=>o.a.n===0).forEach(o=>add(o.x,'No asistió a ningún encuentro','sin'));
  A.filter(o=>o.a.n>0&&o.a.pct<=50).forEach(o=>add(o.x,`Faltó a la mitad o más (vino a ${o.a.n} de ${o.a.tot})`,'mitad'))}
 activos(p).filter(x=>x.repetir==='edicion').forEach(x=>add(x,'Marcado para otra edición','marcado'));
 return out}

function fill(n){const r=buscarPersona(n);

/* ── datos fiscales de las sociedades (editables en Configuración › Valores) ── */
const SOCFIS0=[
 {k:'futuros',nom:'Futuros y Opciones.com SA',cuit:'30-70360510-5',dir:'Madres Plaza 25 de Mayo 3020 1° - CP: 2000 - Rosario'},
 {k:'acopio',nom:'fyo Acopio S.A',cuit:'30-71185564-1',dir:'Madres Plaza 25 de Mayo 3020 1° piso'},
 {k:'amauta',nom:'Amauta Agro S.A',cuit:'30-71063939-2',dir:'Madres Plaza 25 de Mayo 3020 4°'},
 {k:'foods',nom:'fyo Foods',cuit:'30-71825683-2',dir:'Madres Plaza 25 de Mayo 3020 1°'},
 {k:'agrofy',nom:'AGROFY SAU',cuit:'30-71498040-4',dir:'Madres Plaza 25 de Mayo 3020 1°'},
 {k:'amautauy',nom:'Amauta Agro UY',cuit:'',dir:''},{k:'biond',nom:'BIOND',cuit:'',dir:''}];
function socFisL(){DB.cfg=DB.cfg||{};if(!DB.cfg.socFis)DB.cfg.socFis=SOCFIS0.map(x=>({...x}));SOCFIS0.forEach(x=>{if(!DB.cfg.socFis.some(y=>y.k===x.k))DB.cfg.socFis.push({...x})});return DB.cfg.socFis}
function socFisDe(n){const t=String(n||'').toLowerCase();const k=/futuros|^fyo$/.test(t)?'futuros':/acopio|fasa/.test(t)?'acopio':/amauta.*uy|uruguay/.test(t)?'amautauy':/amauta/.test(t)?'amauta':/foods/.test(t)?'foods':/agrofy/.test(t)?'agrofy':/biond/.test(t)?'biond':'';
 return socFisL().find(x=>x.k===k)||null}
function setSocFis(i,k,v){socFisL()[i][k]=v.trim();guardar();toast('Guardado')}
function cfSocFis(){
 return `<div class="card" style="margin-top:16px"><div class="card-h"><h2>Datos fiscales de las sociedades</h2><div class="n">salen en el mensaje "Copiar para el proveedor"</div></div>
  <div class="card-b"><div class="scroll"><table><thead><tr><th>Sociedad</th><th>CUIT</th><th>Dirección fiscal</th></tr></thead>
   <tbody>${socFisL().map((x,i)=>`<tr><td><input class="fi" style="width:210px" value="${esc(x.nom)}" onchange="setSocFis(${i},'nom',this.value)"></td>
    <td><input class="fi num" style="width:150px" value="${esc(x.cuit)}" onchange="setSocFis(${i},'cuit',this.value)"></td>

/* mensaje para pasarle al proveedor: a quién facturar, con CUIT, dirección y monto */
function mensajeFacturar(p){
 const fz=factCfg(p),N=fz.cuotas.length,k=N>1?Math.max(0,fz.cuotas.findIndex(c=>!c.gen)):0,f=N>1?(+fz.cuotas[k].pct||0)/100:1;
 const by={};repartoSoc(p).forEach(g=>{const fi=socFisDe(g.soc),key=fi?fi.k:g.soc;const o=by[key]=by[key]||{fi,soc:g.soc,monto:0};o.monto+=g.monto});
 const gr=Object.values(by).sort((a,b)=>b.monto-a.monto),tot=gr.reduce((a,g)=>a+g.monto,0);
 if(!gr.length||!tot)return{t:'',faltan:[]};
 const objetivo=Math.round((p.real||p.ppto||tot)*f);let reparto=gr.map(g=>Math.round(g.monto/tot*objetivo));
 reparto[0]+=objetivo-reparto.reduce((a,x)=>a+x,0);   /* que la suma dé exacto el total */
 const faltan=[],bloque=g=>{const ok=g.fi&&g.fi.cuit;if(!ok)faltan.push(g.fi?g.fi.nom:g.soc);
  return `Sociedad: ${g.fi?g.fi.nom:g.soc}\nCUIT: ${ok?g.fi.cuit:'(completar)'}\nDirección fiscal: ${g.fi&&g.fi.dir?g.fi.dir:'(completar)'}`};
 let t='Te paso los datos para facturar:\n\n';
 if(N>1)t+=`Factura ${k+1} de ${N} (${Math.round(f*100)}% del total)\n\n`;
 if(gr.length===1)t+=`${bloque(gr[0])}\n\nMonto a facturar: ${plata(objetivo)}`;
 else t+=gr.map((g,i)=>`Imputar el ${Math.round(g.monto/tot*100)}% del total\n${bloque(g)}\nMonto: ${plata(reparto[i])}`).join('\n\n')+`\n\nTotal a facturar: ${plata(objetivo)}`;
 return{t,faltan}}
/* centro de costo: además de la cuenta, en FASA y Amauta cada imputación puede llevar un centro de costo (opcional) */
const cecoDe=soc=>(DB.ceco||[]).filter(c=>c.soc===soc);
const cecoKey=r=>(r.cid||'')+'|'+(r.vn||'');
function cecoSel(p,r){const L=cecoDe(r.soc);if(!L.length)return '';const cur=(p.ceco||{})[cecoKey(r)]||'';
 return `<div style="margin-top:6px"><select class="fi" style="font-size:12px;padding:4px 8px;max-width:100%" title="Centro de costo (opcional)" onchange="cecoSet('${p.id}','${js(cecoKey(r))}',this.value)"><option value="">Centro de costo · opcional</option>${L.map(c=>`<option value="${esc(c.cod)}" ${c.cod===cur?'selected':''}>${esc(c.cod)} · ${esc(c.unidad)}</option>`).join('')}</select></div>`}
function cecoSet(id,key,v){const p=acto(id);p.ceco=p.ceco||{};if(v)p.ceco[key]=v;else delete p.ceco[key];if(!Object.keys(p.ceco).length)delete p.ceco;guardar();volverFicha(id,3);toast(v?'Centro de costo guardado':'Centro de costo quitado')}
function cecoFact(f){const p=f.ref?acto(f.ref):null;if(!p||!p.ceco)return [];const L=cecoDe(f.soc);if(!L.length)return [];
 return [...new Set(Object.entries(p.ceco).filter(([k])=>!f.cid||k.startsWith(f.cid+'|')).map(([,v])=>v))].map(cod=>({cod,unidad:(L.find(c=>c.cod===cod)||{}).unidad||''}))}
const cecoTxt=f=>cecoFact(f).map(c=>c.cod+(c.unidad?' - '+c.unidad:'')).join(' / ');
/* mensaje para imputar internamente: el % de cada cuenta, la referencia y, en FASA, el Centro de Costo para completar */
function mensajeImputacion(p,soloSoc){
 const rows=imputar(p,p.real||p.ppto||1);if(!rows.length)return '';
 const pf=x=>{const v=Math.round(x*10)/10;return (Number.isInteger(v)?String(v):v.toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1}))+'%'};
 const S={};   /* sociedad → (cuenta + centro de costo) → personas */
 rows.forEach(r=>{const c=DB.part.find(x=>x.ej===p.ej&&x.id===r.cid)||DB.part.find(x=>x.id===r.cid)||{},soc=r.soc||c.soc||'',cc=(p.ceco||{})[cecoKey(r)]||'',g=S[soc]=S[soc]||{soc,n:0,ctas:{}},k=(r.cid||((c.cta||'')+'|'+soc))+'|'+cc,o=g.ctas[k]=g.ctas[k]||{cta:c.cta||'a definir',desc:c.desc||'',cc,n:0};o.n+=r.n;g.n+=r.n});
 let t='Referencia: '+p.nom+(p.ej?' · ejercicio '+p.ej:'');
 Object.values(S).filter(g=>!soloSoc||g.soc===soloSoc).sort((a,b)=>b.n-a.n).forEach(g=>{
  const L=Object.values(g.ctas).sort((a,b)=>b.n-a.n),fi=(typeof socFisDe==='function'&&socFisDe(g.soc))||null,nombre=ab(g.soc)||g.soc,libre=/fasa|acopio|amauta/i.test(nombre+' '+g.soc),
   ccTxt=x=>{if(!x.cc)return '';const c=cecoDe(g.soc).find(y=>y.cod===x.cc);return x.cc+(c&&c.unidad?' - '+c.unidad:'')};
  t+='\n\n'+nombre+(fi&&fi.nom&&fi.nom!==nombre?' · '+fi.nom:'')+'\nImputar:\n'+L.map(x=>`* ${pf(x.n/(g.n||1)*100)} en la cuenta ${x.cta}${x.desc?' - '+x.desc:''}`+(libre&&L.length>1?'\n  Centro de Costo: '+ccTxt(x):'')).join('\n')+(libre&&L.length===1?'\nCentro de Costo: '+ccTxt(L[0]):'')});
 return t}
